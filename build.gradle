plugins {
    id 'java'
    id "io.papermc.paperweight.userdev" version "2.0.0-beta.23"
    id 'com.gradleup.shadow' version '9.3.2'
}

group = 'com.playerstats'
version = '1.0'

repositories {
    mavenCentral()

    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    maven { url "https://repo.extendedclip.com/content/repositories/placeholderapi/" }
    maven { url "https://repo.essentialsx.net/releases" }
    maven {
        name = "jitpack"
        url = "https://jitpack.io/"
    }

    maven {
        name = "luckperms"
        url = "https://repo.lucko.me/repository/maven-public/"
    }
}

dependencies {
    // Paper API — включает Adventure (Component, MiniMessage, Audience)
    paperweight.paperDevBundle("1.21.11-R0.1-SNAPSHOT")

    // Базы данных (внутри JAR)
    implementation "org.xerial:sqlite-jdbc:3.43.0.0"
    implementation 'com.mysql:mysql-connector-j:8.4.0'
    implementation 'com.tchristofferson:ConfigUpdater:2.2-SNAPSHOT'

    // Библиотеки (внутри JAR)
    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation("org.bstats:bstats-bukkit:3.2.1")

    compileOnly 'me.clip:placeholderapi:2.12.3'
    compileOnly "net.luckperms:api:5.5"
    compileOnly('com.github.decentsoftware-eu:decentholograms:2.10.1')
    compileOnly 'com.github.Foulest:Vault:2.5.0'

    compileOnly('net.essentialsx:EssentialsX:2.19.0') {
        exclude group: 'org.spigotmc', module: 'spigot-api'
    }

    compileOnly('com.github.Zrips:Jobs:5.2.6.3') {
        transitive = false
    }
}

shadowJar {
    archiveClassifier.set('')

    relocate 'com.zaxxer.hikari', 'com.playerstats.libs.hikari'
    relocate 'com.mysql', 'com.playerstats.libs.mysql'
    relocate 'org.bstats', 'com.playerstats.libs.bstats'
    relocate 'com.tchristofferson.configupdater', 'com.playerstats.libs.configupdater'

    exclude 'org/sqlite/native/Linux-*/**'
    exclude 'org/sqlite/native/Mac/**'
    exclude 'org/sqlite/native/FreeBSD/**'
    exclude 'org/sqlite/native/Linux-Android/**'
    exclude 'org/sqlite/native/AIX/**'
    exclude 'org/sqlite/native/SunOS/**'
    exclude 'org/sqlite/native/Linux-Musl/**'
    exclude 'org/sqlite/native/Linux/ppc64/**'
    exclude 'org/sqlite/native/Linux/ppc64le/**'
    exclude 'org/sqlite/native/Linux/arm/**'
    exclude 'org/sqlite/native/Linux/armv6/**'
    exclude 'org/sqlite/native/Linux/arm7/**'
    exclude 'org/sqlite/native/Linux/aarch64/**'
    exclude 'org/sqlite/native/Linux/riscv64/**'
    exclude 'org/sqlite/native/Linux/s390x/**'
    exclude 'org/sqlite/native/Linux/loongarch64/**'
    exclude 'org/sqlite/native/Windows/x86/**'
    exclude 'org/sqlite/native/Windows/arm/**'
    exclude 'org/sqlite/native/Windows/armv6/**'
    exclude 'org/sqlite/native/Windows/aarch64/**'
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching(['paper-plugin.yml', 'lang/*.yml']) {
        expand props
    }
}