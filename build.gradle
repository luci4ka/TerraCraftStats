plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.3.2'
}

group = 'ru.terracraft'
version = '1.0.6'

repositories {
    mavenCentral()

    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    maven { url 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url 'https://repo.codemc.io/repository/maven-releases/' }
    maven { url 'https://raw.githubusercontent.com/CarmJos/MineSQL/repo/' }
    maven {
        name = "jitpack"
        url = "https://jitpack.io/"
    }
    maven { url 'https://repo.carm.cc/repository/maven-public/' }
}

dependencies {
    // ==================== PAPER ====================
    compileOnly "io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT"
    compileOnly "net.kyori:adventure-api:4.25.0"

    // ==================== COMPILE ONLY ====================
    compileOnly 'me.clip:placeholderapi:2.12.3'
    compileOnly "cc.carm.plugin:minesql-api:1.4.2"
    compileOnly 'cc.carm.lib:easysql-api:0.4.7'
    compileOnly 'dev.jorel:commandapi-paper-core:12.1.0'
    compileOnly 'com.github.luci4ka:TerraCraftCore:v1.0.3:api'
    compileOnly 'com.github.Foulest:Vault:2.5.0'
    compileOnly 'com.github.decentsoftware-eu:decentholograms:2.10.2'


    // ==================== RUNTIME (BUNDLED) ====================
    implementation("org.bstats:bstats-bukkit:3.2.1")

    implementation("de.exlll:configlib-paper:4.8.1")
    implementation('com.github.ez-plugins:mc-plugin-update-notifier:1.0.0')

}

// ============================================================
//  SHADOW JAR
// ============================================================

shadowJar {
    archiveClassifier.set('')

    relocate 'org.bstats', 'ru.terracraft.playerstats.libs.bstats'
    relocate 'de.exlll.configlib', 'ru.terracraft.playerstats.libs.configlib'
    relocate 'com.github.ezplugins', 'ru.terracraft.playerstats.libs.updater'

    exclude 'META-INF/maven/**'
    exclude 'META-INF/LICENSE*'
    exclude 'META-INF/NOTICE*'
    exclude 'module-info.class'
    exclude 'META-INF/versions/**/module-info.class'

    mergeServiceFiles()
}

tasks.named('jar') {
    enabled = false
}

build.dependsOn shadowJar

// ============================================================
//  JAVA
// ============================================================

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching(['paper-plugin.yml', 'lang/*.yml']) {
        expand props
    }
}