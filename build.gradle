plugins {
    id 'java'
    id "io.papermc.paperweight.userdev" version "2.0.0-beta.17"
    id 'com.gradleup.shadow' version '9.0.2'
}

group = 'com.playerstats'
version = '1.0'

repositories {
    mavenCentral()
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    maven { url "https://repo.extendedclip.com/content/repositories/placeholderapi/" }
    maven { url "https://repo.essentialsx.net/releases" }
    maven { url "https://jitpack.io" }
    maven {
        name = "luckperms"
        url = "https://repo.lucko.me/repository/maven-public/"
    }
}

dependencies {
    // Paper API — не включаем в ShadowJar
    paperweight.paperDevBundle("1.21.4-R0.1-SNAPSHOT")

    // Базы данных — включаем SQLite и MySQL, они нужны в плагине
    implementation "org.xerial:sqlite-jdbc:3.43.0.0"
    implementation 'mysql:mysql-connector-java:8.0.33'

    // Плагины, которые есть на сервере — указываем как compileOnly
    compileOnly 'me.clip:placeholderapi:2.11.6'
    compileOnly "net.luckperms:api:5.4"

    // DecentHolograms
    compileOnly 'com.github.decentsoftware-eu:decentholograms:2.9.9'

    // Vault (экономика)
    compileOnly 'com.github.Foulest:Vault:2.5.0'
    compileOnly 'net.essentialsx:EssentialsX:2.21.2'

    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation 'net.kyori:adventure-platform-bukkit:4.4.1'
}

shadowJar {
    archiveClassifier.set('')
    minimize()

    dependencies {
        exclude(dependency('io.papermc.paper:paper-api:.*'))
        exclude(dependency('net.luckperms:api:.*'))
        exclude(dependency('me.clip:placeholderapi:.*'))
        exclude(dependency('com.github.Foulest:Vault:.*'))
        exclude(dependency('net.essentialsx:EssentialsX:.*'))
    }

    // убираем лишние нативки sqlite
    exclude 'org/sqlite/native/Linux-*/**'
    exclude 'org/sqlite/native/Mac/**'
    exclude 'org/sqlite/native/FreeBSD/**'
    exclude 'org/sqlite/native/Linux-Android/**'
    exclude 'org/sqlite/native/AIX/**'
    exclude 'org/sqlite/native/SunOS/**'
    exclude 'org/sqlite/native/Linux-Musl/**'
    exclude 'org/sqlite/native/Linux/ppc64/**'
    exclude 'org/sqlite/native/Linux/ppc64le/**'
    exclude 'org/sqlite/native/Linux/arm/**'
    exclude 'org/sqlite/native/Linux/armv6/**'
    exclude 'org/sqlite/native/Linux/arm7/**'
    exclude 'org/sqlite/native/Linux/aarch64/**'
    exclude 'org/sqlite/native/Linux/riscv64/**'
    exclude 'org/sqlite/native/Linux/s390x/**'
    exclude 'org/sqlite/native/Linux/loongarch64/**'
    exclude 'org/sqlite/native/Windows/x86/**'
    exclude 'org/sqlite/native/Windows/arm/**'
    exclude 'org/sqlite/native/Windows/armv6/**'
    exclude 'org/sqlite/native/Windows/aarch64/**'
    // оставляем только Windows + Linux x86_64
}


def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}
