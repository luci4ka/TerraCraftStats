# =========================================================================
#                    Milestones — вехи
# =========================================================================
# ⚠ ТЕКСТЫ сообщений — в lang/<lang>.yml, секция `milestones`
# =========================================================================

enabled: true

milestones:
  # ===== МОБЫ =====
  mobs_killed:
    10:
      commands: []
    100:
      commands:
        - "give %player% diamond 1"
    500:
      commands:
        - "give %player% diamond 3"
    1000:
      commands:
        - "give %player% netherite_ingot 1"
    5000:
      commands:
        - "give %player% netherite_ingot 5"
    10000:
      commands:
        - "give %player% netherite_block 1"

  # ===== БОССЫ =====
  bosses_killed:
    1:
      commands:
        - "give %player% diamond 1"
    10:
      commands:
        - "give %player% diamond 5"
    50:
      commands:
        - "give %player% netherite_ingot 1"
    100:
      commands:
        - "give %player% netherite_ingot 3"

  # ===== PVP =====
  kills:
    1:
      commands: []
    10:
      commands:
        - "give %player% golden_apple 3"
    50:
      commands:
        - "give %player% diamond 2"
    100:
      commands:
        - "give %player% netherite_ingot 1"
    500:
      commands:
        - "give %player% netherite_block 1"

  deaths:
    10:
      commands: []
    100:
      commands: []
    1000:
      commands:
        - "give %player% golden_apple 1"

  # ===== KILLSTREAK =====
  killstreak:
    5:
      commands:
        - "give %player% golden_apple 1"
