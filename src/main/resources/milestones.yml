      commands:
        - "give %player% diamond 1"
    25:
      commands:
        - "give %player% diamond 3"
    50:
      commands:
        - "give %player% netherite_ingot 1"

  # ===== БЛОКИ =====
  blocks_placed:
    100:
      commands: []
    500:
      commands:
        - "give %player% iron_ingot 5"
    5000:
      commands:
        - "give %player% diamond 2"
    50000:
      commands:
        - "give %player% netherite_ingot 1"

  blocks_broken:
    100:
      commands: []
    1000:
      commands:
        - "give %player% iron_pickaxe 1"
    10000:
