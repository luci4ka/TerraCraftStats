# =========================================================================
#                    Значки топ-1 в TAB
# =========================================================================

enabled: true

# Как часто обновлять значки (в секундах)
refresh-seconds: 300

# Значки для каждой категории
chips:
  kills: "⚔"
  mobs: "☠"
  blocks: "⛏"
  playtime: "⏳"
  balance: "💰"

# Порядок значков в %playerstats_top_chips%
order:
  - kills
  - mobs
  - blocks
  - playtime
  - balance