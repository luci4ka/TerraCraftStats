# =========================================================================
#                    PlayerStats — Українська
# =========================================================================
# Ви можете редагувати цей файл. ConfigUpdater додасть відсутні ключі.
# НЕ використовуйте §-коди — лише MiniMessage (<red>, <gold>, ...).
# =========================================================================

# ==================== Загальні ====================
prefix: "<gold>[PlayerStats]</gold> <gray>"
no-permission: "<red>У вас немає прав для цієї команди."
player-not-found: "<red>Гравця '<yellow>{player}</yellow>' не знайдено."
error: "<red>Сталася помилка. Перевірте консоль."


# =========================================================================
#                    Команди — загальні ключі
# =========================================================================
commands:
  # ===== Загальні =====
  only-player: "<red>Лише гравець може використати цю команду."
  only-player-short: "<red>Лише гравець."
  player-not-found: "<red>Гравця '<yellow>{player}</yellow>' не знайдено."

  # ===== Опис команд (простий текст, без кольорів) =====
  descriptions:
    stats: "Перегляд статистики"
    top: "Показати топ гравців"
    share: "Поділитися статистикою"
    compare: "Порівняти статистику"
    serverstats: "Статистика сервера"
    exclude: "Керування виключеннями"
    playerstats: "Керування плагіном PlayerStats"


# =========================================================================
#                    Snapshot
# =========================================================================
snapshot:
  creating: "<yellow>📸 Створення снепшоту..."
  success: "<green>✅ Снепшот збережено."
  error: "<red>❌ Помилка: {error}"


# =========================================================================
#                    Holograms
# =========================================================================
holograms:
  created: "<green>✅ Голограму створено: <white>{stat}"
  removed: "<green>✅ Голограму видалено: <white>{stat}"
  list-empty: "<yellow>Немає активних голограм."
  list-header: "<green>Активні голограми: <white>{list}"


# =========================================================================
