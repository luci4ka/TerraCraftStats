# =========================================================================
#                    PlayerStats — English
# =========================================================================
# You can edit this file. ConfigUpdater will add missing keys.
# DO NOT use §-codes — only MiniMessage (<red>, <gold>, ...).
# =========================================================================

# ==================== General ====================
prefix: "<gold>[PlayerStats]</gold> <gray>"
no-permission: "<red>You don't have permission to use this command."
player-not-found: "<red>Player '<yellow>{player}</yellow>' not found."
error: "<red>An error occurred. Check console."


# =========================================================================
#                    Commands — common keys
# =========================================================================
commands:
  only-player: "<red>Only a player can use this command."
  only-player-short: "<red>Player only."
  player-not-found: "<red>Player '<yellow>{player}</yellow>' not found."

  descriptions:
    stats: "View statistics"
    top: "Show player leaderboards"
    share: "Share statistics"
    compare: "Compare statistics"
    serverstats: "Server statistics"
    exclude: "Manage exclusions"
    playerstats: "Manage PlayerStats plugin"


# =========================================================================
#                    Status
# =========================================================================
status:
  enabled: "<green>Enabled"
  disabled: "<red>Disabled"
  enabled-f: "<green>Enabled"
  disabled-f: "<red>Disabled"
  connected: "<green>✅"
  disconnected: "<red>❌"


# =========================================================================
#                    Time / K/D / Currency
# =========================================================================
time:
  seconds: "{seconds}s"
  minutes: "{minutes}m"
  hours: "{hours}h {minutes}m"
  times:
    one: "time"
    few: "times"
    many: "times"

  suffix:
    days: "d"
    hours: "h"
    minutes: "m"
  less-than-minute: "<1m"

kd:
  format: "%.2f"
  infinite: "∞"
  zero: "0.00"

currency:
  # Fallback format if Vault is not hooked.
  # {value} — formatted number (e.g. 1500.00)
  format: '\${value}'


# =========================================================================
#                    Snapshot
# =========================================================================
snapshot:
  creating: "<yellow>📸 Creating snapshot..."
  success: "<green>✅ Snapshot saved."
  error: "<red>❌ Error: {error}"


# =========================================================================
#                    /stats — player statistics
# =========================================================================
stats:
  header: "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  title-self: "<gold>📊 {chips}Stats on server <aqua>{server}</aqua>"
  title-other: "<gold>📊 {chips}Stats of <yellow>{player}</yellow> on server <aqua>{server}</aqua>"

  blocks: "<green>🧱 Blocks  <white>Placed: {placed} | Broken: {broken}"
  pve: "<green>☠ PvE  <white>Mobs: {mobs} | Bosses: {bosses}"
  time: "<green>⏳ Time  <white>{time}"
  pvp: "<green>⚔ PvP  <white>Kills: {kills} | Deaths: {deaths} | <gold>K/D: {kd}"
  balance: "<green>💰 Balance  <white>{value}"
  balance-hover: "<gray>Current balance"
  group: "<green>🎖 Group  {value}"
  group-hover: "<gray>Current group"

  sparkline: "<dark_gray>  📈 <gray>Progress ({days}d): <white>{graph}"

  share-button: "<green>  [📤 Share stats]"
  share-hover: "<gray>Click to broadcast your stats"

  hint-subcommands: "<gray>Details: <yellow>/stats pvp <gray>| <yellow>/stats mob <gray>| <yellow>/stats block"

  pvp-title-self: "<yellow>⚔ <white>Your PvP stats <gray>| <green>Kills: <white>{kills} <gray>| <red>Deaths: <white>{deaths} <gray>| <gold>K/D: <white>{kd}"
