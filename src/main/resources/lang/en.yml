    pvp: "⚔ PvP"
    pve: "☠ PvE"
    blocks: "🧱 Blocks"
    time: "⏳ Time"
    killstreak: "🔥 Killstreaks"
    misc: "📦 Misc"
    special: "⭐ Special"

