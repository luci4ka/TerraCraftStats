  pvp-empty: "<gray>No PvP data."

  pvp-entry: "<red>  ☠ <yellow>{player} <gray>— <white>{count} {times}"
  pvp-entry-hover: "<gray>Click to view stats of <white>{player}\n<gray>UUID: <dark_gray>{uuid}"

  mob-title-self: "<yellow>☠ <white>Your PvE stats <gray>| <green>Mobs: <white>{mobs} <gray>| <gold>Bosses: <white>{bosses}"
  mob-title-other: "<yellow>☠ <white>PvE stats of <yellow>{player} <gray>| <green>Mobs: <white>{mobs} <gray>| <gold>Bosses: <white>{bosses}"
  mob-header: "<gray>Mob types killed: <white>{count}"
  mob-empty: "<gray>No mob data."
  mob-entry: "<dark_red>  ☠ <yellow>{name} <gray>— <white>{count} {unit}"

  block-title-self: "<yellow>🧱 <white>Your block stats <gray>| <green>Placed: <white>{placed} <gray>| <red>Broken: <white>{broken}"
  block-title-other: "<yellow>🧱 <white>Block stats of <yellow>{player} <gray>| <green>Placed: <white>{placed} <gray>| <red>Broken: <white>{broken}"
  block-placed-header: "<green>🏗 Placed (<white>{count}<green> types):"
  block-broken-header: "<gold>⛏ Broken (<white>{count}<gold> types):"
  block-empty: "<gray>No data."

  block-placed-entry: "<green>  🏗 <yellow>{name} <gray>— <white>{count} {unit}"
  block-broken-entry: "<gold>  ⛏ <yellow>{name} <gray>— <white>{count} {unit}"

  unit-pieces: "pcs"

  pagination-prev-hover: "<gray>Page {page}"
