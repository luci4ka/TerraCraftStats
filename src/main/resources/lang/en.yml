  hover-snapshot: "<gray>Create a statistics snapshot\n<dark_gray>Example: <white>/playerstats snapshot"
  hover-backup: "<gray>Manage database backups\n<dark_gray>Example: <white>/playerstats backup now"
  hover-hologram: "<gray>Manage holograms\n<dark_gray>Example: <white>/playerstats hologram list"
  hover-info: "<gray>Plugin and integration info\n<dark_gray>Example: <white>/playerstats info"
  hover-apikey: "<gray>Show/regenerate API key\n<dark_gray>Example: <white>/playerstats apikey"
  hover-update: "<gray>Check for plugin updates\n<dark_gray>Example: <white>/playerstats update"

  footer: "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"


# =========================================================================
#                    Currency
# =========================================================================
currency:
  # Fallback format if Vault is not hooked.
  # {value} — formatted number (e.g. 1500.00)
  format: '\${value}'


# =========================================================================
#                    Database backup
# =========================================================================
backup:
  starting: "<yellow>📦 Creating database backup..."
  done: "<green>✅ Backup created."
  error: "<red>❌ Backup error. Check console."

  usage: |-
    <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━
    <gold>📦 Backup management:
    <yellow>/playerstats backup <gray>— create now
    <yellow>/playerstats backup list <gray>— list
    <yellow>/playerstats backup restore <file> <gray>— restore
    <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━

  list-empty: "<yellow>No saved backups."
  list-header: "<gold>📦 Backups (<white>{count}<gold>):"
  list-entry: "<gray>  • <white>{file} <dark_gray>({size})"

  restore-usage: "<red>Usage: <yellow>/playerstats backup restore <file>"
  restore-starting: "<yellow>⏳ Restoring from <white>{file}</white>..."
  restore-done: "<green>✅ Database restored from <white>{file}</white>. <red>Restart the server!"
  restore-error: "<red>❌ Failed to restore from <white>{file}</white>."
  module-disabled: "<red>Module 'backup' is disabled in config.yml."


# =========================================================================
#                    Rollback
# =========================================================================
rollback:
  usage: |-
    <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━
    <gold>🔄 Statistics rollback:
    <yellow>/stats rollback <player> <stat> <value> <gray>— set value
    <yellow>/stats rollback <player> --all <value> <gray>— reset all
    <yellow>/stats rollback <player> --from <date> <stat> <gray>— rollback since date
    <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━

  done: "<green>✅ <white>{player}</white>: <yellow>{stat}</yellow> = <white>{value}"
  done-all: "<green>✅ <white>{player}</white>: all stats reset (<white>{count}</white> entries)"
  done-from: "<green>✅ <white>{player}</white>: <yellow>{stat}</yellow> rolled back by <white>{delta}</white> → <white>{value}"

  notify: "<red>⚠ Your stat <yellow>{stat}</yellow> was changed by an admin: <white>{value}"
  notify-all: "<red>⚠ Your stats were reset by an admin (value: <white>{value}<red>)"

  never-played: "<red>Player <yellow>{player}</yellow> never played on this server."
  invalid-value: "<red>Invalid value: <white>{value}"
  invalid-date: "<red>Invalid date: <white>{date}"
  error: "<red>❌ Rollback error. Check console."


# =========================================================================
#                    Utilities
# =========================================================================
status:
  enabled: "<green>Enabled"
  disabled: "<red>Disabled"
  enabled-f: "<green>Enabled"
  disabled-f: "<red>Disabled"
  connected: "<green>✅"
  disconnected: "<red>❌"

time:
  seconds: "{seconds}s"
  minutes: "{minutes}m"
  hours: "{hours}h {minutes}m"
  times:
    one: "time"
    few: "times"
    many: "times"