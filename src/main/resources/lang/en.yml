# =========================================================================
#                    PlayerStats — English
# =========================================================================
# You can edit this file. ConfigUpdater will add missing keys.
# DO NOT use §-codes — only MiniMessage (<red>, <gold>, ...).
# =========================================================================

# ==================== General ====================
prefix: "<gold>[PlayerStats]</gold> <gray>"
no-permission: "<red>You don't have permission to use this command."
player-not-found: "<red>Player '<yellow>{player}</yellow>' not found."
error: "<red>An error occurred. Check console."


# =========================================================================
#                    Commands — common keys
# =========================================================================
commands:
  # ===== Common =====
  only-player: "<red>Only a player can use this command."
  only-player-short: "<red>Player only."
  player-not-found: "<red>Player '<yellow>{player}</yellow>' not found."

  # ===== Command descriptions (plain text, no colors) =====
  descriptions:
    stats: "View statistics"
    top: "Show player leaderboards"
    share: "Share statistics"
    compare: "Compare statistics"
    serverstats: "Server statistics"
    exclude: "Manage exclusions"
    playerstats: "Manage PlayerStats plugin"
    hologram: "Manage holograms"
    backup: "Manage database backups"
    rollback: "Rollback statistics"


# =========================================================================
#                    Snapshot
# =========================================================================
snapshot:
  creating: "<yellow>📸 Creating snapshot..."
  success: "<green>✅ Snapshot saved."
  error: "<red>❌ Error: {error}"


# =========================================================================
#                    Holograms
# =========================================================================
holograms:
  # Management
  created: "<green>✅ Hologram created: <white>{stat}"
  removed: "<green>✅ Hologram removed: <white>{name}"
  list-empty: "<yellow>No active holograms."
  list-header: "<green>Active holograms: <white>{list}"
  reloaded: "<green>✅ Holograms reloaded."
  module-disabled: "<red>Module 'holograms' is disabled in config.yml."

  # Stat names (for defaultTitle)
  stats:
    play_time: "Play time"
    kills: "Kills"
    mobs_killed: "Mobs"
    bosses_killed: "Bosses"
    blocks_placed: "Blocks placed"
    blocks_broken: "Blocks broken"
    balance: "Balance"
    deaths: "Deaths"
    killstreak: "Killstreak"


# =========================================================================
#                    Stats GUI
# =========================================================================
stats-gui:
  # ===== Title =====
  title: "<dark_gray>📊 Statistics"

  # ===== Tabs =====
  tab-main: "<gold>🏠 Main"
  tab-main-hover: "<gray>Main categories"

  tab-pvp: "<yellow>⚔ PvP"
  tab-pvp-hover: "<gray>Kills and deaths"

  tab-achievements: "<gold>🏆 Achievements <green>({unlocked}/{total})"
  tab-achievements-hover: "<gray>Your achievements progress\n<gray>Unlocked: <green>{unlocked}\n<gray>Total: <white>{total}\n\n<green>▶ Click to view"

  # ===== Buttons =====
  back: "<yellow>◀ Back"
  back-hover: "<gray>Return to main statistics"

  close: "<red>Close"
  close-hover: "<gray>Click to close"

  # ===== "Details" button =====
  click-details: "<green>▶ Click for details"

  # ===== Main: Categories =====
  cat-blocks: "<yellow>🧱 Blocks"
  cat-blocks-lore: "<gray>Placed: <white>{placed}\n<gray>Broken: <white>{broken}\n<gray>Total: <white>{total}"

  cat-pve: "<yellow>☠ PvE"
  cat-pve-lore: "<gray>Mobs: <white>{mobs}\n<gray>Bosses: <white>{bosses}"

  cat-time: "<yellow>⏳ Time"
  cat-time-lore: "<gray>Played: <white>{time}\n<gray>Logins: <white>{logins}"

  cat-pvp: "<yellow>⚔ PvP"
  cat-pvp-lore: "<gray>Kills: <white>{kills}\n<gray>Deaths: <white>{deaths}\n<gray>K/D: <white>{kd}"
  cat-pvp-lore-with-players: "<gray>Kills: <white>{kills}\n<gray>Deaths: <white>{deaths}\n<gray>K/D: <white>{kd}\n\n<gray>Unique players killed: <white>{unique}"

  cat-killstreak: "<yellow>🔥 Killstreak"
  cat-killstreak-lore: "<gray>Current: <white>{current}\n<gray>Best: <white>{best}\n\n<dark_gray>Kill series without dying"

  cat-distance: "<yellow>🏃 Distance"
  cat-distance-lore: "<gray>Walked: <white>{value} blocks\n\n<dark_gray>Total walked"

  cat-damage: "<yellow>💥 Damage"
  cat-damage-lore: "<gray>Dealt: <white>{dealt}\n<gray>Taken: <white>{taken}\n\n<dark_gray>Total damage"

  cat-craft: "<yellow>🔨 Craft"
  cat-craft-lore: "<gray>Crafted: <white>{crafted}\n<gray>Food eaten: <white>{food}\n\n<dark_gray>Total created"

  cat-arrows: "<yellow>🏹 Shooting"
  cat-arrows-lore: "<gray>Arrows: <white>{arrows}\n<gray>Fish caught: <white>{fish}"

  cat-animals: "<yellow>🐾 Animals"
  cat-animals-lore: "<gray>Tamed: <white>{tamed}\n<gray>Bred: <white>{bred}"

  cat-movement: "<yellow>🌐 Movement"
  cat-movement-lore: "<gray>Teleports: <white>{teleports}\n<gray>Portals: <white>{portals}"

  cat-economy: "<yellow>💰 Economy"
  cat-economy-lore: "<gray>Balance: <gold>{balance}\n<gray>Group: {group}"

  # ===== Subpages — titles =====
  sub-pvp-title: "Player Kills"
  sub-mobs-title: "Mob Kills"
  sub-blocks-placed-title: "Blocks Placed"
  sub-blocks-broken-title: "Blocks Broken"

  sub-killstreak-title: "🔥 Killstreak"
  sub-distance-title: "🏃 Distance"
  sub-damage-title: "💥 Damage"
  sub-craft-title: "🔨 Craft"
  sub-arrows-title: "🏹 Shooting"
  sub-animals-title: "🐾 Animals"
  sub-movement-title: "🌐 Movement"
  sub-economy-title: "💰 Economy"

  # ===== Subpages — descriptions =====
  sub-killstreak-desc: "<gray>Kill series without dying.\n<gray>Kill N players in a row — the series grows.\n<dark_gray>If you die — the series resets."
  sub-distance-desc: "<gray>How many blocks you've walked.\n<dark_gray>Walking, running, swimming counted."
  sub-damage-desc: "<gray>How much damage you've dealt and taken.\n<dark_gray>PvP and PvE damage."
  sub-craft-desc: "<gray>How many items you've crafted.\n<dark_gray>Only those made at a crafting table."
  sub-arrows-desc: "<gray>How many arrows you've shot and fish caught.\n<dark_gray>Bow and fishing rod counted."
  sub-animals-desc: "<gray>How many animals you've tamed and bred.\n<dark_gray>Dogs, cats, horses, etc."
  sub-movement-desc: "<gray>How many times you've teleported and used portals.\n<dark_gray>All types counted."
  sub-economy-desc: "<gray>Your balance and group.\n<dark_gray>Balance from Vault."

  # ===== Subpages — section headers =====
  sub-stat-current: "<gray>Current: <white>{value}"
  sub-stat-best: "<gray>Best: <white>{value}"
  sub-stat-dealt: "<gray>Dealt: <white>{value}"
  sub-stat-taken: "<gray>Taken: <white>{value}"
  sub-stat-crafted: "<gray>Crafted: <white>{value}"
  sub-stat-food: "<gray>Eaten: <white>{value}"
  sub-stat-arrows: "<gray>Arrows: <white>{value}"
  sub-stat-fish: "<gray>Fish: <white>{value}"
  sub-stat-tamed: "<gray>Tamed: <white>{value}"
  sub-stat-bred: "<gray>Bred: <white>{value}"
  sub-stat-teleports: "<gray>Teleports: <white>{value}"
  sub-stat-portals: "<gray>Portals: <white>{value}"
  sub-stat-kd: "<gray>K/D: <white>{value}"

  # ===== Subpages — lines =====
  sub-total-types: "<gray>Total types: <white>{count}"
  sub-player-head-lore: "<gray>Killed times: <white>{count}\n<gray>UUID: <dark_gray>{uuid}"
  sub-item-lore: "<gray>Value: <white>{value}\n<gray>Key: <dark_gray>{key}"

  sub-player-prefix: "<yellow>☠ "
  sub-item-prefix: "<yellow>"

  # ===== Pagination =====
  page-prev: "<green>◀ Previous"
  page-prev-hover: "<gray>Page {page} / {total}"
  page-next: "<green>Next ▶"
  page-next-hover: "<gray>Page {page} / {total}"

  # ===== Errors =====
  error-loading: "<red>Failed to load statistics."


# =========================================================================
#                    Achievements GUI
# =========================================================================
achievements-gui:
  title: "<dark_gray>🏆 Achievements"


# =========================================================================
#                    Achievements
# =========================================================================
achievements:
  # ===== GUI =====
  title: "<gold>🏆 Achievements"

  header:
    name: "<gold>🏆 Achievements"
    unlocked: "<gray>Unlocked: <green>{unlocked}</green><gray>/<white>{total}"
    percent: "<gray>Progress: <yellow>{percent}%"
    bar: "<dark_gray>{bar}"
    hint: "<dark_gray>Earn achievements by playing!"

  # ===== Statuses =====
  status-prefix-unlocked: "<green>✓ "
  status-prefix-locked: "<red>✗ "
  status-unlocked: "<green>✓ Unlocked"
  status-locked: "<red>✗ Locked"
  date: "<dark_gray>  {date}"

  # ===== Lines =====
  category: "<dark_gray>▸ <gray>Category: <yellow>{category}"
  progress: "<dark_gray>▸ <gray>Progress: {color}{current}<gray>/<white>{required} <dark_gray>(<yellow>{percent}%<dark_gray>)"
  progress-bar: "<dark_gray>  {bar}"
  requires: "<dark_gray>▸ <gray>Required: <white>{stat} <dark_gray>(<white>{required}<dark_gray>)"

  # ===== Temporary achievements =====
  reset:
    label: "<dark_gray>▸ <gray>Reset: <yellow>{period}"
    reward-repeatable: "<dark_gray>▸ <gray>Reward: <green>repeatable"
    reward-once: "<dark_gray>▸ <gray>Reward: <red>one-time"
    in: "<dark_gray>▸ <gray>Next reset: <white>in {time}"
    ready: "<dark_gray>▸ <gray>Next reset: <green>ready"
    not-started: "<dark_gray>▸ <gray>Next reset: <dark_gray>not started yet"

    # Period names (key = ac.reset())
    daily: "daily"
    weekly: "weekly"
    monthly: "monthly"

  # ===== Buttons =====
  back: "<yellow>◀ Back"
  back-hover: "<gray>Return to stats"

  # ===== Errors =====
  error-loading: "<red>Failed to load achievements."

  # ===== Date format (Java SimpleDateFormat) =====
  date-format: "MM/dd/yyyy HH:mm"

  # ===== Description color (optional) =====
  description-color: "<gray>"

  # ===== Messages =====
  messages:
    unlock-self: "<gold>🏆 <yellow>Achievement unlocked: <white>{name}"
    unlock-description: "<gray>   {description}"
    unlock-broadcast: "<gold>🏆 <yellow>{player} <gray>unlocked achievement <white>{name}<gray>!"
    reset: "<gray>⏳ Achievement <white>{name}</white> has been reset — you can earn it again."

  # ===== Categories =====
