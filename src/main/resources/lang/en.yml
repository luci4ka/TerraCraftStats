  broadcast: "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n<gold>📊 <yellow>{chips}{player}</yellow> shared their stats!\n<gray>Server: <aqua>{server}</aqua> <gray>| Group: <light_purple>{group}"
  broadcast-hover: "<gray>Click to view stats\n<gray>Player: <white>{player}\n<gray>Server: <white>{server}\n<gray>Group: {group}\n<gray>K/D: <white>{kd}"

  stats: "\n<green>⏳ Time: <white>{time} <gray>(total: {total-time})\n<green>☠ PvE: <white>Mobs {mobs} | Bosses {bosses} <gray>(total mobs: {total-mobs})\n<green>⛏ Blocks: <white>Placed {blocks}\n<green>⚔ PvP: <white>Kills {kills} | Deaths {deaths} <gray>| K/D: {kd}\n<green>💰 Balance: <gold>{balance}\n<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  private-sender: "<green>You shared your stats with <yellow>{target}</yellow>"
  private-target: "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n<gold>📊 <yellow>{chips}{player}</yellow> shared their stats with you:\n<gray>Server: <aqua>{server}</aqua> <gray>| Group: <light_purple>{group}\n<green>⏳ Time: <white>{time} <gray>(total: {total-time})\n<green>☠ PvE: <white>Mobs {mobs} | Bosses {bosses}\n<green>⚔ PvP: <white>Kills {kills} | Deaths {deaths} <gray>| K/D: {kd}\n<green>💰 Balance: <gold>{balance}\n<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  private-hover: "<gray>Click to view stats\n<gray>Player: <white>{player}\n<gray>K/D: <white>{kd}"


