# =========================================================================
help:
  header: "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  title: "<gold>📊 PlayerStats <yellow>— 帮助"
  available: "<gray>   可用命令: <yellow>{count}"

  # ===== 区块 =====
  section-stats: "<dark_gray>━━ <gold>📊 统计</gold> ━━"
  section-tops: "<dark_gray>━━ <gold>🏆 排行</gold> ━━"
  section-social: "<dark_gray>━━ <gold>📤 社交</gold> ━━"
  section-admin: "<dark_gray>━━ <gold>⚙ 管理</gold> ━━"

  # ===== 命令 =====
  commands-title: "<gold>命令:"
  command-stats: "<yellow>   /stats <gray>— 您的统计"
  command-stats-other: "<yellow>   /stats <player> <gray>— 玩家统计"
  command-stats-gui: "<yellow>   /stats gui <gray>— 统计 GUI"
  command-stats-pvp: "<yellow>   /stats pvp [player] <gray>— PvP 统计"
  command-top: "<yellow>   /top <gray>— 服务器排行"
  command-top-stat: "<yellow>   /top <stat> <gray>— 按统计排行"
  command-top-pvp: "<yellow>   /top pvp <玩家> <gray>— 击杀某玩家排行"
  command-share: "<yellow>   /share [player] <gray>— 分享统计"
  command-compare: "<yellow>   /compare <player> <gray>— 对比统计"
  command-exclude: "<yellow>   /exclude <player> [remove|list] <gray>— 排除"
  command-reload: "<yellow>   /playerstats reload <gray>— 重新加载"
  command-info: "<yellow>   /playerstats info <gray>— 插件信息"
  command-update: "<yellow>   /playerstats update <gray>— 检查更新"

  # ===== 空输出 =====
  no-commands: "<gray>   您没有权限使用任何命令。"

  # ===== Hover 提示 =====
  hover-stats: "<gray>显示您的统计\n<dark_gray>示例: <white>/stats"
  hover-stats-gui: "<gray>打开统计 GUI\n<dark_gray>示例: <white>/stats gui"
  hover-stats-other: "<gray>其他玩家的统计\n<dark_gray>示例: <white>/stats Steve"
  hover-stats-pvp: "<gray>击杀的玩家列表 (PvP)\n<dark_gray>示例: <white>/stats pvp Steve"

  hover-top: "<gray>按类别的服务器排行\n<dark_gray>示例: <white>/top"
  hover-top-stat: "<gray>按特定统计排行\n<dark_gray>示例: <white>/top kills"
  hover-top-pvp: "<gray>特定玩家的击杀排行\n<dark_gray>示例: <white>/top pvp Steve"

  hover-share: "<gray>在聊天中分享统计\n<dark_gray>示例: <white>/share\n<dark_gray>示例: <white>/share Steve"
  hover-compare: "<gray>与其他玩家对比统计\n<dark_gray>示例: <white>/compare Steve"

  hover-exclude: "<gray>管理统计排除\n<dark_gray>示例: <white>/exclude Steve\n<dark_gray>示例: <white>/exclude list"
  hover-reload: "<gray>重新加载配置和缓存\n<dark_gray>示例: <white>/playerstats reload"
  hover-info: "<gray>插件和集成信息\n<dark_gray>示例: <white>/playerstats info"
  hover-update: "<gray>检查插件更新\n<dark_gray>示例: <white>/playerstats update"

  footer: "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"


# =========================================================================
#                    货币
# =========================================================================
currency:
  # 如果未连接 Vault，则使用 fallback 格式。
  # {value} — 格式化后的数字 (例如 1500.00)
  format: "¥{value}"


# =========================================================================
#                    工具
# =========================================================================
status:
  enabled: "<green>已启用"
  disabled: "<red>已禁用"
  enabled-f: "<green>已启用"
  disabled-f: "<red>已禁用"
  connected: "<green>✅"
  disconnected: "<red>❌"

time:
  seconds: "{seconds}秒"
  minutes: "{minutes}分"
  hours: "{hours}时 {minutes}分"