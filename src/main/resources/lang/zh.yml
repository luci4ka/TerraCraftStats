# =========================================================================
#                    PlayerStats — 简体中文
# =========================================================================
# 您可以编辑此文件。ConfigUpdater 将添加缺失的键。
# 不要使用 § 代码 — 仅限 MiniMessage (<red>, <gold>, ...)。
# =========================================================================

# ==================== 通用 ====================
prefix: "<gold>[PlayerStats]</gold> <gray>"
no-permission: "<red>您没有权限使用此命令。"
player-not-found: "<red>玩家 '<yellow>{player}</yellow>' 未找到。"
error: "<red>发生错误。请检查控制台。"


# =========================================================================
#                    命令 — 通用键
# =========================================================================
commands:
  # ===== 通用 =====
  only-player: "<red>只有玩家可以使用此命令。"
  only-player-short: "<red>仅限玩家。"
  player-not-found: "<red>玩家 '<yellow>{player}</yellow>' 未找到。"

  # ===== 命令描述（纯文本，无颜色） =====
  descriptions:
    stats: "查看统计"
    top: "显示玩家排行榜"
    share: "分享统计"
    compare: "对比统计"
    serverstats: "服务器统计"
    exclude: "管理排除"
    playerstats: "管理 PlayerStats 插件"


# =========================================================================
#                    Snapshot
# =========================================================================
snapshot:
  creating: "<yellow>📸 正在创建快照..."
  success: "<green>✅ 快照已保存。"
  error: "<red>❌ 错误: {error}"


# =========================================================================
#                    Holograms
# =========================================================================
holograms:
  created: "<green>✅ 全息图已创建: <white>{stat}"
  removed: "<green>✅ 全息图已移除: <white>{stat}"
  list-empty: "<yellow>没有活动的全息图。"
  list-header: "<green>活动的全息图: <white>{list}"


# =========================================================================
#                    Stats GUI
# =========================================================================
stats-gui:
  # ===== 标题 =====
  title: "<dark_gray>📊 统计"

  # ===== 标签 =====
  tab-main: "<gold>🏠 主页"
  tab-main-hover: "<gray>主要类别"

  tab-pvp: "<yellow>⚔ PvP"
  tab-pvp-hover: "<gray>击杀与死亡"

  tab-achievements: "<gold>🏆 成就 <green>({unlocked}/{total})"
  tab-achievements-hover: "<gray>你的成就进度\n<gray>已解锁: <green>{unlocked}\n<gray>总计: <white>{total}\n\n<green>▶ 点击查看"

  # ===== 按钮 =====
  back: "<yellow>◀ 返回"
  back-hover: "<gray>返回主统计"

  close: "<red>关闭"
  close-hover: "<gray>点击关闭"

  # ===== «详情» 按钮 =====
  click-details: "<green>▶ 点击查看详情"

  # ===== 主页: 类别 =====
  cat-blocks: "<yellow>🧱 方块"
  cat-blocks-lore: "<gray>放置: <white>{placed}\n<gray>破坏: <white>{broken}\n<gray>总计: <white>{total}"

  cat-pve: "<yellow>☠ PvE"
  cat-pve-lore: "<gray>怪物: <white>{mobs}\n<gray>首领: <white>{bosses}"

  cat-time: "<yellow>⏳ 时间"
  cat-time-lore: "<gray>已玩: <white>{time}\n<gray>登录: <white>{logins}"

  cat-pvp: "<yellow>⚔ PvP"
  cat-pvp-lore: "<gray>击杀: <white>{kills}\n<gray>死亡: <white>{deaths}\n<gray>K/D: <white>{kd}"
  cat-pvp-lore-with-players: "<gray>击杀: <white>{kills}\n<gray>死亡: <white>{deaths}\n<gray>K/D: <white>{kd}\n\n<gray>击杀的独立玩家: <white>{unique}"

  cat-killstreak: "<yellow>🔥 连杀"
  cat-killstreak-lore: "<gray>当前: <white>{current}\n<gray>最佳: <white>{best}\n\n<dark_gray>不死连杀"

  cat-distance: "<yellow>🏃 距离"
  cat-distance-lore: "<gray>已行走: <white>{value} 方块\n\n<dark_gray>总行走"

  cat-damage: "<yellow>💥 伤害"
  cat-damage-lore: "<gray>造成: <white>{dealt}\n<gray>受到: <white>{taken}\n\n<dark_gray>总伤害"

  cat-craft: "<yellow>🔨 合成"
  cat-craft-lore: "<gray>已合成: <white>{crafted}\n<gray>已食用: <white>{food}\n\n<dark_gray>总创建"

  cat-arrows: "<yellow>🏹 射击"
  cat-arrows-lore: "<gray>箭矢: <white>{arrows}\n<gray>钓鱼: <white>{fish}"

  cat-animals: "<yellow>🐾 动物"
  cat-animals-lore: "<gray>驯服: <white>{tamed}\n<gray>繁殖: <white>{bred}"

  cat-movement: "<yellow>🌐 移动"
  cat-movement-lore: "<gray>传送: <white>{teleports}\n<gray>传送门: <white>{portals}"

  cat-economy: "<yellow>💰 经济"
  cat-economy-lore: "<gray>余额: <gold>{balance}\n<gray>权限组: {group}"

  # ===== 子页面 — 标题 =====
  sub-pvp-title: "玩家击杀"
  sub-mobs-title: "怪物击杀"
  sub-blocks-placed-title: "已放置方块"
  sub-blocks-broken-title: "已破坏方块"

  sub-killstreak-title: "🔥 连杀"
  sub-distance-title: "🏃 距离"
  sub-damage-title: "💥 伤害"
  sub-craft-title: "🔨 合成"
  sub-arrows-title: "🏹 射击"
  sub-animals-title: "🐾 动物"
  sub-movement-title: "🌐 移动"
  sub-economy-title: "💰 经济"

  # ===== 子页面 — 描述 =====
