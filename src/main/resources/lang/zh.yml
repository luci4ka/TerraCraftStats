#                    /share — 分享
# =========================================================================
share:
  self: "<red>不能与自己分享统计。请使用 /stats。"

  broadcast: "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n<gold>📊 <yellow>{chips}{player}</yellow> 分享了统计数据!\n<gray>服务器: <aqua>{server}</aqua> <gray>| 权限组: <light_purple>{group}"
  broadcast-hover: "<gray>点击查看统计\n<gray>玩家: <white>{player}\n<gray>服务器: <white>{server}\n<gray>权限组: {group}\n<gray>K/D: <white>{kd}"

  stats: "\n<green>⏳ 时间: <white>{time} <gray>(总计: {total-time})\n<green>☠ PvE: <white>怪物 {mobs} | 首领 {bosses} <gray>(总计怪物: {total-mobs})\n<green>⛏ 方块: <white>已放置 {blocks}\n<green>⚔ PvP: <white>击杀 {kills} | 死亡 {deaths} <gray>| K/D: {kd}\n<green>💰 余额: <gold>{balance}\n<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  private-sender: "<green>您已与 <yellow>{target}</yellow> 分享统计"
  private-target: "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n<gold>📊 <yellow>{chips}{player}</yellow> 与您分享了统计:\n<gray>服务器: <aqua>{server}</aqua> <gray>| 权限组: <light_purple>{group}\n<green>⏳ 时间: <white>{time} <gray>(总计: {total-time})\n<green>☠ PvE: <white>怪物 {mobs} | 首领 {bosses}\n<green>⚔ PvP: <white>击杀 {kills} | 死亡 {deaths} <gray>| K/D: {kd}\n<green>💰 余额: <gold>{balance}\n<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
