# =========================================================================
#                    /stats rollback — 统计回滚
# =========================================================================
rollback:
  usage: |-
    <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━
    <gold>🔄 统计回滚:
    <yellow>/stats rollback <player> <stat> <value> <gray>— 设置值
    <yellow>/stats rollback <player> --all <gray>— 重置全部
    <yellow>/stats rollback <player> --from <date> <stat> <gray>— 从日期回滚
    <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━

  done: "<green>✅ <white>{player}</white>: <yellow>{stat}</yellow> = <white>{value}"
  done-all: "<green>✅ <white>{player}</white>: 所有统计已重置 (<white>{count}</white> 条)"
  done-from: "<green>✅ <white>{player}</white>: <yellow>{stat}</yellow> 回滚 <white>{delta}</white> → <white>{value}"

  from-disabled: "<red>按日期回滚已禁用: <yellow>rollback.track-deltas: false</yellow> 在 config.yml 中。"

