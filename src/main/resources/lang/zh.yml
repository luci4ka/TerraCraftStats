# =========================================================================
#                    PlayerStats — 简体中文
# =========================================================================
# 您可以编辑此文件。ConfigUpdater 将添加缺失的键。
# 不要使用 § 代码 — 仅限 MiniMessage (<red>, <gold>, ...)。
# =========================================================================

# ==================== 通用 ====================
prefix: "<gold>[PlayerStats]</gold> <gray>"
no-permission: "<red>您没有权限使用此命令。"
player-not-found: "<red>玩家 '<yellow>{player}</yellow>' 未找到。"
error: "<red>发生错误。请检查控制台。"


# =========================================================================
#                    命令 — 通用键
# =========================================================================
commands:
  only-player: "<red>只有玩家可以使用此命令。"
  only-player-short: "<red>仅限玩家。"
  player-not-found: "<red>玩家 '<yellow>{player}</yellow>' 未找到。"

  descriptions:
    stats: "查看统计"
    top: "显示玩家排行榜"
    share: "分享统计"
    compare: "对比统计"
    serverstats: "服务器统计"
    exclude: "管理排除"
    playerstats: "管理 PlayerStats 插件"


# =========================================================================
#                    Status
# =========================================================================
status:
  enabled: "<green>已启用"
  disabled: "<red>已禁用"
  enabled-f: "<green>已启用"
  disabled-f: "<red>已禁用"
  connected: "<green>✅"
  disconnected: "<red>❌"


# =========================================================================
#                    时间 / K/D / 货币
# =========================================================================
time:
  seconds: "{seconds}秒"
  minutes: "{minutes}分"
  hours: "{hours}时 {minutes}分"
  times:
    one: "次"
    few: "次"
    many: "次"

  suffix:
    days: "天"
    hours: "时"
    minutes: "分"
  less-than-minute: "<1分"

kd:
  format: "%.2f"
  infinite: "∞"
  zero: "0.00"

currency:
  # 如果未连接 Vault，则使用 fallback 格式。
  # {value} — 格式化后的数字 (例如 1500.00)
  format: "¥{value}"


# =========================================================================
#                    Snapshot
# =========================================================================
snapshot:
  creating: "<yellow>📸 正在创建快照..."
  success: "<green>✅ 快照已保存。"
  error: "<red>❌ 错误: {error}"


# =========================================================================
#                    /stats — 玩家统计
# =========================================================================
stats:
  header: "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  title-self: "<gold>📊 {chips}<aqua>{server}</aqua> 上的统计"
  title-other: "<gold>📊 {chips}玩家 <yellow>{player}</yellow> 在 <aqua>{server}</aqua> 上的统计"

  blocks: "<green>🧱 方块  <white>放置: {placed} | 破坏: {broken}"
  pve: "<green>☠ PvE  <white>怪物: {mobs} | 首领: {bosses}"
  time: "<green>⏳ 时间  <white>{time}"
  pvp: "<green>⚔ PvP  <white>击杀: {kills} | 死亡: {deaths} | <gold>K/D: {kd}"
  balance: "<green>💰 余额  <white>{value}"
  balance-hover: "<gray>当前余额"
  group: "<green>🎖 权限组  {value}"
  group-hover: "<gray>当前权限组"

  sparkline: "<dark_gray>  📈 <gray>进度 ({days}天): <white>{graph}"

  share-button: "<green>  [📤 分享统计]"
  share-hover: "<gray>点击将统计发送到聊天"

  hint-subcommands: "<gray>详情: <yellow>/stats pvp <gray>| <yellow>/stats mob <gray>| <yellow>/stats block"

  pvp-title-self: "<yellow>⚔ <white>您的 PvP 统计 <gray>| <green>击杀: <white>{kills} <gray>| <red>死亡: <white>{deaths} <gray>| <gold>K/D: <white>{kd}"
  pvp-title-other: "<yellow>⚔ <white>玩家 <yellow>{player} <white>的 PvP 统计 <gray>| <green>击杀: <white>{kills} <gray>| <red>死亡: <white>{deaths} <gray>| <gold>K/D: <white>{kd}"
  pvp-header: "<gray>击杀玩家: <white>{count}"
  pvp-empty: "<gray>无 PvP 数据。"

  pvp-entry: "<red>  ☠ <yellow>{player} <gray>— <white>{count} {times}"
  pvp-entry-hover: "<gray>点击查看 <white>{player} 的统计\n<gray>UUID: <dark_gray>{uuid}"

  mob-title-self: "<yellow>☠ <white>您的 PvE 统计 <gray>| <green>怪物: <white>{mobs} <gray>| <gold>首领: <white>{bosses}"
  mob-title-other: "<yellow>☠ <white>玩家 <yellow>{player} <white>的 PvE 统计 <gray>| <green>怪物: <white>{mobs} <gray>| <gold>首领: <white>{bosses}"
  mob-header: "<gray>击杀怪物种类: <white>{count}"
  mob-empty: "<gray>无怪物数据。"
  mob-entry: "<dark_red>  ☠ <yellow>{name} <gray>— <white>{count} {unit}"

  block-title-self: "<yellow>🧱 <white>您的方块统计 <gray>| <green>放置: <white>{placed} <gray>| <red>破坏: <white>{broken}"
  block-title-other: "<yellow>🧱 <white>玩家 <yellow>{player} <white>的方块统计 <gray>| <green>放置: <white>{placed} <gray>| <red>破坏: <white>{broken}"
  block-placed-header: "<green>🏗 已放置 (<white>{count}<green> 种):"
  block-broken-header: "<gold>⛏ 已破坏 (<white>{count}<gold> 种):"
  block-empty: "<gray>无数据。"

  block-placed-entry: "<green>  🏗 <yellow>{name} <gray>— <white>{count} {unit}"
  block-broken-entry: "<gold>  ⛏ <yellow>{name} <gray>— <white>{count} {unit}"

  unit-pieces: "个"

  pagination-prev-hover: "<gray>第 {page} 页"
  pagination-next-hover: "<gray>第 {page} 页"


