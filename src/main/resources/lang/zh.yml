  sub-distance-desc: "<gray>你行走的方块数。\n<dark_gray>包括走、跑、游泳。"
  sub-damage-desc: "<gray>你造成和受到的伤害。\n<dark_gray>PvP 和 PvE 伤害。"
  sub-craft-desc: "<gray>你合成的物品数。\n<dark_gray>仅工作台合成。"
  sub-arrows-desc: "<gray>你射出的箭和钓到的鱼。\n<dark_gray>包括弓和钓竿。"
  sub-animals-desc: "<gray>你驯服和繁殖的动物。\n<dark_gray>狗、猫、马等。"
  sub-movement-desc: "<gray>你传送和使用传送门的次数。\n<dark_gray>包括所有类型。"
  sub-economy-desc: "<gray>你的余额和权限组。\n<dark_gray>余额来自 Vault。"

  # ===== 子页面 — 区块标题 =====
  sub-stat-current: "<gray>当前: <white>{value}"
  sub-stat-best: "<gray>最佳: <white>{value}"
  sub-stat-dealt: "<gray>造成: <white>{value}"
  sub-stat-taken: "<gray>受到: <white>{value}"
  sub-stat-crafted: "<gray>已合成: <white>{value}"
  sub-stat-food: "<gray>已食用: <white>{value}"
  sub-stat-arrows: "<gray>箭矢: <white>{value}"
  sub-stat-fish: "<gray>鱼: <white>{value}"
  sub-stat-tamed: "<gray>驯服: <white>{value}"
  sub-stat-bred: "<gray>繁殖: <white>{value}"
  sub-stat-teleports: "<gray>传送: <white>{value}"
  sub-stat-portals: "<gray>传送门: <white>{value}"
  sub-stat-kd: "<gray>K/D: <white>{value}"

  # ===== 子页面 — 行 =====
  sub-total-types: "<gray>总类型: <white>{count}"
  sub-player-head-lore: "<gray>击杀次数: <white>{count}\n<gray>UUID: <dark_gray>{uuid}"
  sub-item-lore: "<gray>值: <white>{value}\n<gray>键: <dark_gray>{key}"

  sub-player-prefix: "<yellow>☠ "
  sub-item-prefix: "<yellow>"

  # ===== 分页 =====
  page-prev: "<green>◀ 上一页"
  page-prev-hover: "<gray>第 {page} / {total} 页"
  page-next: "<green>下一页 ▶"
  page-next-hover: "<gray>第 {page} / {total} 页"

  # ===== 错误 =====
  error-loading: "<red>加载统计失败。"


# =========================================================================
#                    Achievements GUI
# =========================================================================
achievements-gui:
  title: "<dark_gray>🏆 成就"


# =========================================================================
#                    Achievements — 成就
# =========================================================================
achievements:
  # ===== GUI =====
  title: "<gold>🏆 成就"

  header:
    name: "<gold>🏆 成就"
    unlocked: "<gray>已解锁: <green>{unlocked}</green><gray>/<white>{total}"
    percent: "<gray>进度: <yellow>{percent}%"
    bar: "<dark_gray>{bar}"
    hint: "<dark_gray>玩游戏以解锁成就!"

  # ===== 状态 =====
  status-prefix-unlocked: "<green>✓ "
  status-prefix-locked: "<red>✗ "
  status-unlocked: "<green>✓ 已解锁"
  status-locked: "<red>✗ 未解锁"
  date: "<dark_gray>  {date}"

  # ===== 错误 =====
  error-loading: "<red>加载成就失败。"

  # ===== 日期格式 (Java SimpleDateFormat) =====
  date-format: "yyyy/MM/dd HH:mm"

  # ===== 描述颜色（可选） =====
  description-color: "<gray>"

  # ===== 行 =====
  category: "<dark_gray>▸ <gray>类别: <yellow>{category}"
