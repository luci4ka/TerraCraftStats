  format: "{value}₽"


# =========================================================================
#                    Бэкап БД
# =========================================================================
backup:
  starting: "<yellow>📦 Создание бэкапа БД..."
  done: "<green>✅ Бэкап создан."
  error: "<red>❌ Ошибка бэкапа. Проверьте консоль."

  usage: |-
    <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━
    <gold>📦 Управление бэкапами:
    <yellow>/playerstats backup <gray>— создать сейчас
    <yellow>/playerstats backup list <gray>— список
    <yellow>/playerstats backup restore <file> <gray>— восстановить
    <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━

  list-empty: "<yellow>Нет сохранённых бэкапов."
  list-header: "<gold>📦 Бэкапы (<white>{count}<gold>):"
  list-entry: "<gray>  • <white>{file} <dark_gray>({size})"

  restore-usage: "<red>Использование: <yellow>/playerstats backup restore <file>"
  restore-starting: "<yellow>⏳ Восстановление из <white>{file}</white>..."
  restore-done: "<green>✅ БД восстановлена из <white>{file}</white>. <red>Перезапустите сервер!"
  restore-error: "<red>❌ Не удалось восстановить из <white>{file}</white>."
  module-disabled: "<red>Модуль 'backup' выключен в config.yml."


# =========================================================================
#                    Rollback статистики
# =========================================================================
rollback:
  usage: |-
    <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━
    <gold>🔄 Откат статистики:
    <yellow>/stats rollback <player> <stat> <value> <gray>— установить значение
    <yellow>/stats rollback <player> --all <value> <gray>— обнулить всё
    <yellow>/stats rollback <player> --from <date> <stat> <gray>— откат с даты
    <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━

  done: "<green>✅ <white>{player}</white>: <yellow>{stat}</yellow> = <white>{value}"
  done-all: "<green>✅ <white>{player}</white>: все статы обнулены (<white>{count}</white> записей)"
  done-from: "<green>✅ <white>{player}</white>: <yellow>{stat}</yellow> откат на <white>{delta}</white> → <white>{value}"

  notify: "<red>⚠ Ваша статистика <yellow>{stat}</yellow> была изменена администратором: <white>{value}"
  notify-all: "<red>⚠ Ваша статистика была сброшена администратором (значение: <white>{value}<red>)"

  never-played: "<red>Игрок <yellow>{player}</yellow> никогда не играл на сервере."
  invalid-value: "<red>Некорректное значение: <white>{value}"
  invalid-date: "<red>Некорректная дата: <white>{date}"
  error: "<red>❌ Ошибка отката. Проверьте консоль."


