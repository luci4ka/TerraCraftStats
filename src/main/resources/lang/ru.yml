  disabled: "<red>Выключен"
  enabled-f: "<green>Включена"
  disabled-f: "<red>Выключена"
  connected: "<green>✅"
  disconnected: "<red>❌"

time:
  seconds: "{seconds}с"
  minutes: "{minutes}м"
  hours: "{hours}ч {minutes}м"
  times:
    one: "раз"
    few: "раза"
    many: "раз"