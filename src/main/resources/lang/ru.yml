  cat-economy: "<yellow>Экономика"
  cat-economy-lore: "<gray>Баланс: <gold>{balance}\n<gray>Группа: {group}"

  # --- Ряд 4: actions (37), combat (39), block-extra (41) ---
  cat-actions: "<yellow>Действия"
