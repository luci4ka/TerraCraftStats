# =========================================================================
#                    /top — топы
# =========================================================================
# Спрайты вставляются в Java-коде ПЕРЕД этими строками:
#   top.category-time    -> SpriteUtil.item("minecraft:item/clock")
#   top.category-mobs    -> SpriteUtil.item("minecraft:item/zombie_head")
#   top.category-blocks  -> SpriteUtil.block("minecraft:bricks")
#   top.category-pvp     -> SpriteUtil.item("minecraft:item/netherite_sword")
#   top.category-balance -> SpriteUtil.item("minecraft:item/gold_ingot")
# =========================================================================
top:
  header: "<dark_gray>━━━━━━━━━━ <gold>Топы сервера</gold> ━━━━━━━━━━"
  footer: "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  category-time: "<yellow>▸ Время игры"
  category-mobs: "<yellow>▸ Убито мобов"
  category-blocks: "<yellow>▸ Поставлено блоков"
  category-pvp: "<yellow>▸ PvP (убийства игроков)"
  category-balance: "<yellow>▸ Баланс"

  category-pvp-victim: "<yellow>Убийства игрока <white>{victim}"
  category-custom: "<yellow>▸ Топ: <white>{stat}"

  no-data: "<gray>   Нет данных"
  refresh: "<gray>[Обновить]"
  refresh-hover: "<gray>Нажмите, чтобы обновить топ"

  entry-hover: "<gray>Игрок: <white>{player}\n<gray>Место: <yellow>#{rank}\n<gray>Значение: <white>{value}\n<dark_gray>Нажмите для просмотра"

  stat-prefixes:
