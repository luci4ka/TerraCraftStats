    play_time: "Время игры"
    blocks_placed: "Поставлено блоков"
    blocks_broken: "Сломано блоков"
    balance: "Баланс"


# =========================================================================
#                    /compare — сравнение
# =========================================================================
compare:
  self: "<red>Нельзя сравнить статистику с самим собой."
  header: "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  title: "<gold>Сравнение: <yellow>{player1}</yellow> <gray>vs</gray> <yellow>{player2}</yellow>"

  button: "<aqua>[{player}]</aqua>"
  button-hover: "<gray>Открыть статистику <white>{player}"

  winner: "   <yellow>Победитель: <gold>{winner}</gold> <gray>({wins1} : {wins2})"
  draw: "   <gray>Ничья! ({wins1} : {wins2})"

  line-blocks: "Блоки"
  line-pve: "PvE"
  line-time: "Время"
  line-pvp: "PvP"
  line-kd: "   K/D"
  line-balance: "Баланс"

  hover-value-1: "<gray>Значение 1: <white>{value}"
  hover-value-2: "<gray>Значение 2: <white>{value}"
  hover-diff: "<gray>Разница: <white>{diff}"


# =========================================================================
#                    /share — поделиться
# =========================================================================
# Спрайт вставляется в Java-коде ПЕРЕД share.broadcast:
#   SpriteUtil.item("minecraft:item/writable_book")
# =========================================================================
share:
  self: "<red>Нельзя поделиться статистикой с самим собой. Используйте /stats."

  broadcast: "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n<gold><yellow>{chips}{player}</yellow> поделился статистикой!\n<gray>Сервер: <aqua>{server}</aqua> <gray>| Группа: <light_purple>{group}"
  broadcast-hover: "<gray>Нажмите, чтобы открыть статистику\n<gray>Игрок: <white>{player}\n<gray>Сервер: <white>{server}\n<gray>Группа: {group}\n<gray>K/D: <white>{kd}"

  stats: "\n<green>Время: <white>{time} <gray>(всего: {total-time})\n<green>PvE: <white>Мобы {mobs} | Боссы {bosses} <gray>(всего мобов: {total-mobs})\n<green>Блоки: <white>Поставлено {blocks}\n<green>PvP: <white>Убийств {kills} | Смертей {deaths} <gray>| K/D: {kd}\n<green>Баланс: <gold>{balance}\n<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  private-sender: "<green>Вы поделились статистикой с <yellow>{target}</yellow>"
  private-target: "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n<gold><yellow>{chips}{player}</yellow> поделился с вами статистикой:\n<gray>Сервер: <aqua>{server}</aqua> <gray>| Группа: <light_purple>{group}\n<green>Время: <white>{time} <gray>(всего: {total-time})\n<green>PvE: <white>Мобы {mobs} | Боссы {bosses}\n<green>PvP: <white>Убийств {kills} | Смертей {deaths} <gray>| K/D: {kd}\n<green>Баланс: <gold>{balance}\n<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  private-hover: "<gray>Нажмите, чтобы открыть статистику\n<gray>Игрок: <white>{player}\n<gray>K/D: <white>{kd}"


# =========================================================================
#                    /serverstats — статистика сервера
# =========================================================================
# Спрайты вставляются в Java-коде ПЕРЕД этими строками:
#   serverstats.unique-players -> SpriteUtil.item("minecraft:item/player_head")
#   serverstats.line-time      -> SpriteUtil.item("minecraft:item/clock")
#   serverstats.line-balance   -> SpriteUtil.item("minecraft:item/gold_ingot")
# =========================================================================
serverstats:
  title: "<gold>Статистика сервера <aqua>{server}</aqua>"

  section-players: "<dark_gray>━━ <gold>Игроки</gold> ━━"
  section-activity: "<dark_gray>━━ <gold>Активность</gold> ━━"
  section-blocks: "<dark_gray>━━ <gold>Блоки</gold> ━━"
  section-economy: "<dark_gray>━━ <gold>Экономика</gold> ━━"

  unique-players: "   <green>Уникальных игроков: <white>{value}"
  line: "   <green>{value}"
  line-time: "   <green>Общее время игры: <white>{value}"
  line-balance: "   <green>Общий баланс: <gold>{value}"

  stat-playtime-hover: "<gray>Суммарное время игры всех игроков"
  stat-mobs-hover: "<gray>Суммарное убийство мобов"
  stat-bosses-hover: "<gray>Суммарное убийство боссов"
  stat-kills-hover: "<gray>Суммарные PvP-убийства"
  stat-deaths-hover: "<gray>Суммарные смерти игроков"
  stat-blocks-placed-hover: "<gray>Суммарно поставлено блоков"
  stat-blocks-broken-hover: "<gray>Суммарно сломано блоков"
  stat-balance-hover: "<gray>Суммарный баланс всех игроков"
  click-hint: "<dark_gray>Нажмите для просмотра /top {stat}"


# =========================================================================
#                    /exclude — исключения
# =========================================================================
exclude:
  added: "<green>Игрок <yellow>{player}</yellow> исключён из статистики."
  removed: "<green>Игрок <yellow>{player}</yellow> возвращён в статистику."
  already-excluded: "<yellow>Игрок '<white>{player}</white>' уже исключён."
  not-excluded: "<yellow>Игрок '<white>{player}</white>' не исключён."
  never-played: "<red>Игрок '<white>{player}</white>' никогда не играл на сервере."

  button-undo: "↩ Отменить"
  button-undo-hover: "<gray>Вернуть <white>{player}</white> в статистику"

  button-stats: "Статистика"
  button-stats-hover: "<gray>Открыть статистику <white>{player}"

  button-undo-short: "↩"
  button-undo-short-hover: "<gray>Вернуть <white>{player}</white> в статистику"

  button-stats-short: "S"
  button-stats-short-hover: "<gray>Открыть статистику <white>{player}"

  bullet: "  • "
  separator-bracket-left: "  ["
  separator-bracket-left-short: " ["
  separator-bracket-right: "]"

  list-header: "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━\n<gold>Исключённые игроки (<yellow>{count}</yellow>):"
  list-empty: "<yellow>Нет исключённых игроков."
  list-footer: "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━"
  list-entry: "<dark_gray>  • <red>{player}"

  help: |
    <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━
    <gold>Управление исключениями:
    <yellow>/exclude <player> <gray>— исключить из статистики
    <yellow>/exclude remove <player> <gray>— вернуть в статистику
    <yellow>/exclude list <gray>— список исключённых
    <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━


# =========================================================================
#                    /stats rollback — откат статистики
# =========================================================================
rollback:
  usage: |-
    <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━
    <gold>Откат статистики:
    <yellow>/stats rollback <player> <stat> <value> <gray>— установить значение
    <yellow>/stats rollback <player> --all <gray>— обнулить всё
    <yellow>/stats rollback <player> --from <date> <stat> <gray>— откат с даты
    <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━

  done: "<green><white>{player}</white>: <yellow>{stat}</yellow> = <white>{value}"
  done-all: "<green><white>{player}</white>: все статы обнулены (<white>{count}</white> записей)"
  done-from: "<green><white>{player}</white>: <yellow>{stat}</yellow> откат на <white>{delta}</white> → <white>{value}"

  from-disabled: "<red>Откат по дате отключён: <yellow>rollback.track-deltas: false</yellow> в config.yml."

  notify: "<red>Ваша статистика <yellow>{stat}</yellow> была изменена администратором: <white>{value}"
  notify-all: "<red>Ваша статистика была сброшена администратором."

  never-played: "<red>Игрок <yellow>{player}</yellow> никогда не играл на сервере."
  invalid-value: "<red>Некорректное значение: <white>{value}"
  invalid-date: "<red>Некорректная дата: <white>{date}"
  error: "<red>Ошибка отката. Проверьте консоль."


