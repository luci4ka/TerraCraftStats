# =========================================================================
#                    PlayerStats — Русский
# =========================================================================
# Файл можно редактировать. ConfigUpdater добавит новые ключи.
# НЕ используйте §-коды — только MiniMessage (<red>, <gold>, ...).
#
# Эмодзи убраны. Спрайты вставляются в Java-коде через SpriteUtil.
# =========================================================================


# =========================================================================
#                    Общее
# =========================================================================
prefix: "<gold>[PlayerStats]</gold> <gray>"
no-permission: "<red>У вас нет прав для этой команды."
player-not-found: "<red>Игрок '<yellow>{player}</yellow>' не найден."
error: "<red>Произошла ошибка. Проверьте консоль."


# =========================================================================
#                    Команды — общие ключи
# =========================================================================
commands:
  only-player: "<red>Только игрок может использовать эту команду."
  only-player-short: "<red>Только игрок."
  player-not-found: "<red>Игрок '<yellow>{player}</yellow>' не найден."

  descriptions:
    stats: "Просмотр статистики"
    top: "Показать топ игроков"
    share: "Поделиться статистикой"
    compare: "Сравнить статистику"
    serverstats: "Статистика сервера"
    exclude: "Управление исключениями"
    playerstats: "Управление плагином PlayerStats"


# =========================================================================
#                    Status (общее)
# =========================================================================
status:
  enabled: "<green>Включен"
  disabled: "<red>Выключен"
  enabled-f: "<green>Включена"
  disabled-f: "<red>Выключена"
  connected: "<green>OK"
  disconnected: "<red>OFF"


# =========================================================================
#                    Время / K/D / Валюта (FormatUtil, TimeUtil)
# =========================================================================
time:
  seconds: "{seconds}с"
  minutes: "{minutes}м"
  hours: "{hours}ч {minutes}м"
  times:
    one: "раз"
    few: "раза"
    many: "раз"

  suffix:
    days: "д"
    hours: "ч"
    minutes: "м"
  less-than-minute: "<1м"

kd:
  format: "%.2f"
  infinite: "∞"
  zero: "0.00"

currency:
  format: "{value}₽"


# =========================================================================
#                    Snapshot
# =========================================================================
snapshot:
  creating: "<yellow>Создание снапшота..."
  success: "<green>Снапшот сохранён."
  error: "<red>Ошибка: {error}"


# =========================================================================
#                    /stats — статистика игрока
# =========================================================================
# Спрайты вставляются в Java-коде ПЕРЕД этими строками:
#   stats.blocks  -> SpriteUtil.block("minecraft:bricks")
#   stats.pve     -> SpriteUtil.item("minecraft:item/zombie_head")
#   stats.time    -> SpriteUtil.item("minecraft:item/clock")
#   stats.pvp     -> SpriteUtil.item("minecraft:item/netherite_sword")
#   stats.balance -> SpriteUtil.item("minecraft:item/gold_ingot")
#   stats.group   -> SpriteUtil.item("minecraft:item/name_tag")
# =========================================================================
stats:
  header: "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  title-self: "<gold>{chips}Статистика на сервере <aqua>{server}</aqua>"
  title-other: "<gold>{chips}Статистика игрока <yellow>{player}</yellow> на сервере <aqua>{server}</aqua>"

  blocks: "<green>Блоки  <white>Поставлено: {placed} | Сломано: {broken}"
  pve: "<green>PvE  <white>Мобы: {mobs} | Боссы: {bosses}"
  time: "<green>Время  <white>{time}"
  pvp: "<green>PvP  <white>Убийств: {kills} | Смертей: {deaths} | <gold>K/D: {kd}"
  balance: "<green>Баланс  <white>{value}"
  balance-hover: "<gray>Текущий баланс"
  group: "<green>Привилегия  {value}"
  group-hover: "<gray>Текущая группа"

  sparkline: "<dark_gray>  <gray>Прогресс ({days}д): <white>{graph}"

  share-button: "<green>  [Поделиться статистикой]"
  share-hover: "<gray>Нажмите, чтобы отправить статистику в чат"

  hint-subcommands: "<gray>Подробнее: <yellow>/stats pvp <gray>| <yellow>/stats mob <gray>| <yellow>/stats block"

  pvp-title-self: "<yellow><white>Ваша PvP-статистика <gray>| <green>Убийств: <white>{kills} <gray>| <red>Смертей: <white>{deaths} <gray>| <gold>K/D: <white>{kd}"
  pvp-title-other: "<yellow><white>PvP-статистика <yellow>{player} <gray>| <green>Убийств: <white>{kills} <gray>| <red>Смертей: <white>{deaths} <gray>| <gold>K/D: <white>{kd}"
  pvp-header: "<gray>Убито игроков: <white>{count}"
  pvp-empty: "<gray>Нет данных о PvP."

  pvp-entry: "<red>  <yellow>{player} <gray>— <white>{count} {times}"
  pvp-entry-hover: "<gray>Нажмите, чтобы посмотреть статистику <white>{player}\n<gray>UUID: <dark_gray>{uuid}"

  mob-title-self: "<yellow><white>Ваша PvE-статистика <gray>| <green>Мобов: <white>{mobs} <gray>| <gold>Боссов: <white>{bosses}"
  mob-title-other: "<yellow><white>PvE-статистика <yellow>{player} <gray>| <green>Мобов: <white>{mobs} <gray>| <gold>Боссов: <white>{bosses}"
  mob-header: "<gray>Убито типов мобов: <white>{count}"
  mob-empty: "<gray>Нет данных о мобах."
  mob-entry: "<dark_red>  <yellow>{name} <gray>— <white>{count} {unit}"

  block-title-self: "<yellow><white>Ваша статистика блоков <gray>| <green>Поставлено: <white>{placed} <gray>| <red>Сломано: <white>{broken}"
  block-title-other: "<yellow><white>Статистика блоков <yellow>{player} <gray>| <green>Поставлено: <white>{placed} <gray>| <red>Сломано: <white>{broken}"
  block-placed-header: "<green>Поставлено (<white>{count}<green> типов):"
  block-broken-header: "<gold>Сломано (<white>{count}<gold> типов):"

  jumps: "<green>Прыжки  <white>{value}"
  sneak_time: "<green>Скрытность  <white>{value}"
  sprint_time: "<green>Бег  <white>{value}"
  elytra_distance: "<green>Элитры  <white>{value}"
  boat_distance: "<green>Лодка  <white>{value}"
  minecart_distance: "<green>Вагонетка  <white>{value}"
  damage_blocked: "<green>Заблокировано  <white>{value}"
  items_enchanted: "<green>Зачаровано  <white>{value}"
  items_broken: "<green>Сломано инструментов  <white>{value}"
  animals_sheared: "<green>Пострижено  <white>{value}"
  villager_trades: "<green>Сделок с жителями  <white>{value}"
  crops_harvested: "<green>Собрано урожая  <white>{value}"
  crops_planted: "<green>Посажено  <white>{value}"
  sleeps: "<green>Снов  <white>{value}"
  commands_used: "<green>Команд  <white>{value}"
  chat_messages: "<green>Сообщений  <white>{value}"
  totems_used: "<green>Тотемов  <white>{value}"
  experience_gained: "<green>Опыта  <white>{value}"
  levels_gained: "<green>Уровней  <white>{value}"
  potions_brewed: "<green>Сварено зелий  <white>{value}"
  potions_drunk: "<green>Выпито зелий  <white>{value}"
  signs_placed: "<green>Табличек  <white>{value}"
  beds_placed: "<green>Кроватей  <white>{value}"
  tnt_ignited: "<green>Подожжено ТНТ  <white>{value}"
  cakes_eaten: "<green>Съедено тортов  <white>{value}"
  snow_golems_built: "<green>Снеговиков  <white>{value}"
  diamonds_mined: "<green>Алмазов  <white>{value}"
  netherite_mined: "<green>Незерита  <white>{value}"
  sprint_distance: "<green>Пробежано  <white>{value}"
  sneak_distance: "<green>Проползено  <white>{value}"
  climbed_ladders: "<green>По лестницам  <white>{value}"
  bells_rung: "<green>Звонов  <white>{value}"
  dolphins_fed: "<green>Накормлено дельфинов  <white>{value}"
  block-empty: "<gray>Нет данных."

  block-placed-entry: "<green>  <yellow>{name} <gray>— <white>{count} {unit}"
  block-broken-entry: "<gold>  <yellow>{name} <gray>— <white>{count} {unit}"

  unit-pieces: "шт"

  pagination-prev-hover: "<gray>Страница {page}"
  pagination-next-hover: "<gray>Страница {page}"


# =========================================================================
#                    /stats gui — GUI статистики
# =========================================================================
stats-gui:
  title: "<dark_gray>Статистика"

  # ===== Табы =====
  tab-main: "<gold>Главная"
  tab-main-hover: "<gray>Основные категории"

  tab-pvp: "<yellow>PvP"
  tab-pvp-hover: "<gray>Убийства и смерти"

  # ===== Кнопки =====
  back: "<yellow>◀ Назад"
  back-hover: "<gray>Вернуться к основной статистике"

  close: "<red>Закрыть"
  close-hover: "<gray>Нажмите, чтобы закрыть"

  click-details: "<green>▶ Нажмите для подробностей"

  header-name: "<gold>{player}"
  header-kd: "<gray>K/D: <white>{value}"
  header-time: "<gray>Время: <white>{value}"
  header-blocks: "<gray>Всего блоков: <white>{value}"
  header-group: "<gray>Группа: {value}"

  # ===== Прочее =====
  sub-empty-lore: "<gray>Нажмите для подробностей"
  sub-desc-title: "<gray>Описание"

  sparkline-title: "<gray>Прогресс"
  sparkline-value: "<white>{value}"

  # =========================================================================
  #   Главная: Категории (в порядке слотов GUI)
  # =========================================================================

  # --- Ряд 1: blocks (10), pve (12), time (14), pvp (16) ---
  cat-blocks: "<yellow>Блоки"
  cat-blocks-lore: "<gray>Поставлено: <white>{placed}\n<gray>Сломано: <white>{broken}\n<gray>Всего: <white>{total}"

  cat-pve: "<yellow>PvE"
  cat-pve-lore: "<gray>Мобы: <white>{mobs}\n<gray>Боссы: <white>{bosses}"

  cat-time: "<yellow>Время"
  cat-time-lore: "<gray>Играл: <white>{time}\n<gray>Входов: <white>{logins}"

  cat-pvp: "<yellow>PvP"
  cat-pvp-lore: "<gray>Убийств: <white>{kills}\n<gray>Смертей: <white>{deaths}\n<gray>K/D: <white>{kd}"
  cat-pvp-lore-with-players: "<gray>Убийств: <white>{kills}\n<gray>Смертей: <white>{deaths}\n<gray>K/D: <white>{kd}\n\n<gray>Убито игроков (уник.): <white>{unique}"

  # --- Ряд 2: killstreak (19), distance (21), damage (23), craft (25) ---
  cat-killstreak: "<yellow>Killstreak"
  cat-killstreak-lore: "<gray>Текущая: <white>{current}\n<gray>Лучшая: <white>{best}\n\n<dark_gray>Серия убийств без смертей"

  cat-distance: "<yellow>Дистанция"
  cat-distance-lore: "<gray>Пройдено: <white>{value} блоков\n<gray>Бегом: <white>{sprint}\n<gray>В приседе: <white>{sneak}\n<gray>По лестницам: <white>{ladders}\n\n<dark_gray>Всего пройдено"

  cat-damage: "<yellow>Урон"
  cat-damage-lore: "<gray>Нанесено: <white>{dealt}\n<gray>Получено: <white>{taken}\n<gray>Заблокировано: <white>{blocked}\n\n<dark_gray>Общий урон"

  cat-craft: "<yellow>Крафт"
  cat-craft-lore: "<gray>Скрафтено: <white>{crafted}\n<gray>Съедено: <white>{food}\n<gray>Зачаровано: <white>{enchanted}\n<gray>Сварено зелий: <white>{potions}\n\n<dark_gray>Всего создано"

  # --- Ряд 3: arrows (28), animals (30), movement (32), economy (34) ---
  cat-arrows: "<yellow>Стрельба"
  cat-arrows-lore: "<gray>Стрел: <white>{arrows}\n<gray>Поймано рыбы: <white>{fish}"

  cat-animals: "<yellow>Животные"
