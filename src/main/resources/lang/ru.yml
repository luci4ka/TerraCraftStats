    reset: "<gray>⏳ Достижение <white>{name}</white> сброшено — можно получить заново."

  # ===== Категории =====
  categories:
    pvp: "⚔ PvP"
    pve: "☠ PvE"
    blocks: "🧱 Блоки"
    time: "⏳ Время"
    killstreak: "🔥 Серии"
    misc: "📦 Разное"
    special: "⭐ Особые"

