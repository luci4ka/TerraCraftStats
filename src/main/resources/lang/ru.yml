# =========================================================================
#                    PlayerStats — Русский
# =========================================================================
# Файл можно редактировать. ConfigUpdater добавит новые ключи.
# НЕ используйте §-коды — только MiniMessage (<red>, <gold>, ...).
# =========================================================================

# ==================== Общие ====================
prefix: "<gold>[PlayerStats]</gold> <gray>"
no-permission: "<red>У вас нет прав для этой команды."
player-not-found: "<red>Игрок '<yellow>{player}</yellow>' не найден."
error: "<red>Произошла ошибка. Проверьте консоль."


# =========================================================================
#                    Команды — общие ключи
# =========================================================================
commands:
  # ===== Общие =====
  only-player: "<red>Только игрок может использовать эту команду."
  only-player-short: "<red>Только игрок."
  player-not-found: "<red>Игрок '<yellow>{player}</yellow>' не найден."

  # ===== Описания команд (plain text, без цветов) =====
  descriptions:
    stats: "Просмотр статистики"
    top: "Показать топ игроков"
    share: "Поделиться статистикой"
    compare: "Сравнить статистику"
    serverstats: "Статистика сервера"
    exclude: "Управление исключениями"
    playerstats: "Управление плагином PlayerStats"
    hologram: "Управление голограммами"
    backup: "Управление бэкапами БД"
    rollback: "Откат статистики"


# =========================================================================
#                    Snapshot
# =========================================================================
snapshot:
  creating: "<yellow>📸 Создание снапшота..."
  success: "<green>✅ Снапшот сохранён."
  error: "<red>❌ Ошибка: {error}"


# =========================================================================
#                    Holograms
# =========================================================================
holograms:
  # Управление
  created: "<green>✅ Голограмма создана: <white>{stat}"
  removed: "<green>✅ Голограмма удалена: <white>{name}"
  list-empty: "<yellow>Нет активных голограмм."
  list-header: "<green>Активные голограммы: <white>{list}"
  reloaded: "<green>✅ Голограммы перезагружены."
  module-disabled: "<red>Модуль 'holograms' выключен в config.yml."

  # Названия статов (для defaultTitle)
  stats:
    play_time: "Время игры"
    kills: "Убийства"
    mobs_killed: "Мобы"
    bosses_killed: "Боссы"
    blocks_placed: "Поставлено блоков"
    blocks_broken: "Сломано блоков"
    balance: "Баланс"
    deaths: "Смерти"
    killstreak: "Серия убийств"


# =========================================================================
#                    Stats GUI
# =========================================================================
stats-gui:
  # ===== Заголовок =====
  title: "<dark_gray>📊 Статистика"

  # ===== Табы =====
  tab-main: "<gold>🏠 Главная"
  tab-main-hover: "<gray>Основные категории"

  tab-pvp: "<yellow>⚔ PvP"
  tab-pvp-hover: "<gray>Убийства и смерти"

  tab-achievements: "<gold>🏆 Достижения <green>({unlocked}/{total})"
  tab-achievements-hover: "<gray>Твой прогресс достижений\n<gray>Разблокировано: <green>{unlocked}\n<gray>Всего: <white>{total}\n\n<green>▶ Нажмите для просмотра"

  # ===== Кнопки =====
  back: "<yellow>◀ Назад"
  back-hover: "<gray>Вернуться к основной статистике"

  close: "<red>Закрыть"
  close-hover: "<gray>Нажмите, чтобы закрыть"

  # ===== Кнопка «Подробнее» =====
  click-details: "<green>▶ Нажмите для подробностей"

  # ===== Главная: Категории =====
  cat-blocks: "<yellow>🧱 Блоки"
  cat-blocks-lore: "<gray>Поставлено: <white>{placed}\n<gray>Сломано: <white>{broken}\n<gray>Всего: <white>{total}"

  cat-pve: "<yellow>☠ PvE"
  cat-pve-lore: "<gray>Мобы: <white>{mobs}\n<gray>Боссы: <white>{bosses}"

  cat-time: "<yellow>⏳ Время"
  cat-time-lore: "<gray>Играл: <white>{time}\n<gray>Входов: <white>{logins}"

  cat-pvp: "<yellow>⚔ PvP"
  cat-pvp-lore: "<gray>Убийств: <white>{kills}\n<gray>Смертей: <white>{deaths}\n<gray>K/D: <white>{kd}"
  cat-pvp-lore-with-players: "<gray>Убийств: <white>{kills}\n<gray>Смертей: <white>{deaths}\n<gray>K/D: <white>{kd}\n\n<gray>Убито игроков (уник.): <white>{unique}"

  cat-killstreak: "<yellow>🔥 Killstreak"
  cat-killstreak-lore: "<gray>Текущая: <white>{current}\n<gray>Лучшая: <white>{best}\n\n<dark_gray>Серия убийств без смертей"

  cat-distance: "<yellow>🏃 Дистанция"
  cat-distance-lore: "<gray>Пройдено: <white>{value} блоков\n\n<dark_gray>Всего пройдено"

  cat-damage: "<yellow>💥 Урон"
  cat-damage-lore: "<gray>Нанесено: <white>{dealt}\n<gray>Получено: <white>{taken}\n\n<dark_gray>Общий урон"

  cat-craft: "<yellow>🔨 Крафт"
  cat-craft-lore: "<gray>Скрафтено: <white>{crafted}\n<gray>Съедено еды: <white>{food}\n\n<dark_gray>Всего создано"

  cat-arrows: "<yellow>🏹 Стрельба"
  cat-arrows-lore: "<gray>Стрел: <white>{arrows}\n<gray>Поймано рыбы: <white>{fish}"

  cat-animals: "<yellow>🐾 Животные"
  cat-animals-lore: "<gray>Приручено: <white>{tamed}\n<gray>Разведено: <white>{bred}"

  cat-movement: "<yellow>🌐 Перемещение"
  cat-movement-lore: "<gray>Телепортов: <white>{teleports}\n<gray>Порталов: <white>{portals}"

  cat-economy: "<yellow>💰 Экономика"
  cat-economy-lore: "<gray>Баланс: <gold>{balance}\n<gray>Группа: {group}"

  # ===== Подстраницы — заголовки =====
  sub-pvp-title: "Убийства игроков"
  sub-mobs-title: "Убийства мобов"
  sub-blocks-placed-title: "Поставлено блоков"
  sub-blocks-broken-title: "Сломано блоков"

  sub-killstreak-title: "🔥 Killstreak"
  sub-distance-title: "🏃 Дистанция"
  sub-damage-title: "💥 Урон"
  sub-craft-title: "🔨 Крафт"
  sub-arrows-title: "🏹 Стрельба"
  sub-animals-title: "🐾 Животные"
  sub-movement-title: "🌐 Перемещение"
  sub-economy-title: "💰 Экономика"

  # ===== Подстраницы — описания =====
  sub-killstreak-desc: "<gray>Серия убийств без смертей.\n<gray>Убей N игроков подряд — серия растёт.\n<dark_gray>Умрёшь — серия обнулится."
  sub-distance-desc: "<gray>Сколько блоков ты прошёл.\n<dark_gray>Учитывается ходьба, бег, плавание."
  sub-damage-desc: "<gray>Сколько урона ты нанёс и получил.\n<dark_gray>Урон в PvP и PvE."
  sub-craft-desc: "<gray>Сколько предметов ты скрафтил.\n<dark_gray>Только созданные через верстак."
  sub-arrows-desc: "<gray>Сколько стрел ты выпустил и рыб поймал.\n<dark_gray>Учитывается лук и удочка."
  sub-animals-desc: "<gray>Сколько животных ты приручил и развёл.\n<dark_gray>Собаки, кошки, лошади и др."
  sub-movement-desc: "<gray>Сколько раз ты телепортировался и использовал порталы.\n<dark_gray>Учитываются все типы."
  sub-economy-desc: "<gray>Твой баланс и привилегия.\n<dark_gray>Баланс из Vault."

  # ===== Подстраницы — заголовки секций =====
  sub-stat-current: "<gray>Текущее: <white>{value}"
  sub-stat-best: "<gray>Лучшее: <white>{value}"
  sub-stat-dealt: "<gray>Нанесено: <white>{value}"
  sub-stat-taken: "<gray>Получено: <white>{value}"
  sub-stat-crafted: "<gray>Скрафтено: <white>{value}"
  sub-stat-food: "<gray>Съедено: <white>{value}"
  sub-stat-arrows: "<gray>Стрел: <white>{value}"
  sub-stat-fish: "<gray>Рыбы: <white>{value}"
  sub-stat-tamed: "<gray>Приручено: <white>{value}"
  sub-stat-bred: "<gray>Разведено: <white>{value}"
  sub-stat-teleports: "<gray>Телепортов: <white>{value}"
  sub-stat-portals: "<gray>Порталов: <white>{value}"
  sub-stat-kd: "<gray>K/D: <white>{value}"

  # ===== Подстраницы — строки =====
  sub-total-types: "<gray>Всего типов: <white>{count}"
  sub-player-head-lore: "<gray>Убито раз: <white>{count}\n<gray>UUID: <dark_gray>{uuid}"
  sub-item-lore: "<gray>Значение: <white>{value}\n<gray>Ключ: <dark_gray>{key}"

  sub-player-prefix: "<yellow>☠ "
  sub-item-prefix: "<yellow>"

  # ===== Пагинация =====
  page-prev: "<green>◀ Предыдущая"
  page-prev-hover: "<gray>Страница {page} / {total}"
  page-next: "<green>Следующая ▶"
  page-next-hover: "<gray>Страница {page} / {total}"

  # ===== Ошибки =====
  error-loading: "<red>Ошибка загрузки статистики."


# =========================================================================
#                    Achievements GUI
# =========================================================================
achievements-gui:
  title: "<dark_gray>🏆 Достижения"


# =========================================================================
#                    Achievements — достижения
# =========================================================================
achievements:
  # ===== GUI =====
  title: "<gold>🏆 Достижения"

  header:
    name: "<gold>🏆 Достижения"
    unlocked: "<gray>Разблокировано: <green>{unlocked}</green><gray>/<white>{total}"
    percent: "<gray>Прогресс: <yellow>{percent}%"
    bar: "<dark_gray>{bar}"
    hint: "<dark_gray>Получай достижения за игру!"

  # ===== Статусы =====
  status-prefix-unlocked: "<green>✓ "
  status-prefix-locked: "<red>✗ "
  status-unlocked: "<green>✓ Разблокировано"
  status-locked: "<red>✗ Не разблокировано"
  date: "<dark_gray>  {date}"

  # ===== Строки =====
  category: "<dark_gray>▸ <gray>Категория: <yellow>{category}"
  progress: "<dark_gray>▸ <gray>Прогресс: {color}{current}<gray>/<white>{required} <dark_gray>(<yellow>{percent}%<dark_gray>)"
  progress-bar: "<dark_gray>  {bar}"
  requires: "<dark_gray>▸ <gray>Требуется: <white>{stat} <dark_gray>(<white>{required}<dark_gray>)"

  # ===== Временные достижения =====
  reset:
    label: "<dark_gray>▸ <gray>Сброс: <yellow>{period}"
    reward-repeatable: "<dark_gray>▸ <gray>Награда: <green>повторяемая"
    reward-once: "<dark_gray>▸ <gray>Награда: <red>одноразовая"
    in: "<dark_gray>▸ <gray>Следующий сброс: <white>через {time}"
    ready: "<dark_gray>▸ <gray>Следующий сброс: <green>готово"
    not-started: "<dark_gray>▸ <gray>Следующий сброс: <dark_gray>ещё не начат"

    # Названия периодов (ключ = ac.reset())
    daily: "ежедневно"
    weekly: "еженедельно"
    monthly: "ежемесячно"

  # ===== Кнопки =====
  back: "<yellow>◀ Назад"
  back-hover: "<gray>Вернуться к статистике"

  # ===== Ошибки =====
  error-loading: "<red>Ошибка загрузки достижений."

  # ===== Формат даты (Java SimpleDateFormat) =====
  date-format: "dd.MM.yyyy HH:mm"

  # ===== Цвет описания =====
  description-color: "<gray>"

  # ===== Сообщения =====
