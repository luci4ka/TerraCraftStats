# =========================================================================
#                    Valyuta
# =========================================================================
currency:
  # Vault ulanmagan bo'lsa, fallback formati.
  # {value} — formatlangan raqam (masalan, 1500.00)
  format: "{value}so'm"


# =========================================================================
#                    Ma'lumotlar bazasi zaxira nusxasi
# =========================================================================
backup:
  starting: "<yellow>📦 Ma'lumotlar bazasi zaxira nusxasi yaratilmoqda..."
  done: "<green>✅ Zaxira nusxa yaratildi."
  error: "<red>❌ Zaxira nusxa xatoligi. Konsolni tekshiring."

  usage: |-
    <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━
    <gold>📦 Zaxira nusxalarni boshqarish:
    <yellow>/playerstats backup <gray>— hozir yaratish
    <yellow>/playerstats backup list <gray>— ro'yxat
    <yellow>/playerstats backup restore <file> <gray>— tiklash
    <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━

  list-empty: "<yellow>Saqlangan zaxira nusxalar yo'q."
  list-header: "<gold>📦 Zaxira nusxalar (<white>{count}<gold>):"
  list-entry: "<gray>  • <white>{file} <dark_gray>({size})"

  restore-usage: "<red>Foydalanish: <yellow>/playerstats backup restore <file>"
  restore-starting: "<yellow>⏳ <white>{file}</white> dan tiklanmoqda..."
  restore-done: "<green>✅ MB <white>{file}</white> dan tiklandi. <red>Serverni qayta ishga tushiring!"
  restore-error: "<red>❌ <white>{file}</white> dan tiklab bo'lmadi."
  module-disabled: "<red>'backup' moduli config.yml da o'chirilgan."


# =========================================================================
#                    Statistikani qaytarish
# =========================================================================
rollback:
  usage: |-
    <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━
    <gold>🔄 Statistikani qaytarish:
    <yellow>/stats rollback <player> <stat> <value> <gray>— qiymat o'rnatish
    <yellow>/stats rollback <player> --all <value> <gray>— hammasini nolga tushirish
    <yellow>/stats rollback <player> --from <date> <stat> <gray>— sanadan qaytarish
    <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━

  done: "<green>✅ <white>{player}</white>: <yellow>{stat}</yellow> = <white>{value}"
  done-all: "<green>✅ <white>{player}</white>: barcha statlar nolga tushirildi (<white>{count}</white> yozuv)"
  done-from: "<green>✅ <white>{player}</white>: <yellow>{stat}</yellow> <white>{delta}</white> ga qaytarildi → <white>{value}"

  notify: "<red>⚠ Sizning <yellow>{stat}</yellow> stattingiz administrator tomonidan o'zgartirildi: <white>{value}"
  notify-all: "<red>⚠ Sizning statlaringiz administrator tomonidan nolga tushirildi (qiymat: <white>{value}<red>)"

  never-played: "<red>O'yinchi <yellow>{player}</yellow> serverda hech qachon o'ynamagan."
  invalid-value: "<red>Noto'g'ri qiymat: <white>{value}"
  invalid-date: "<red>Noto'g'ri sana: <white>{date}"
  error: "<red>❌ Qaytarish xatoligi. Konsolni tekshiring."


