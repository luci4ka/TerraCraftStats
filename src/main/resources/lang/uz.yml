#                    Yordamchi
# =========================================================================
status:
  enabled: "<green>Yoqilgan"
  disabled: "<red>O'chirilgan"
  enabled-f: "<green>Yoqilgan"
  disabled-f: "<red>O'chirilgan"
  connected: "<green>✅"
  disconnected: "<red>❌"

time:
  seconds: "{seconds}s"
  minutes: "{minutes}d"
  hours: "{hours}soat {minutes}daq"
  times:
    one: "marta"
    few: "marta"
    many: "marta"