# =========================================================================
#                    Achievements GUI
# =========================================================================
achievements-gui:
  title: "<dark_gray>🏆 Дасягненні"


# =========================================================================
#                    Achievements — дасягненні
# =========================================================================
achievements:
  # ===== GUI =====
  title: "<gold>🏆 Дасягненні"

  header:
    name: "<gold>🏆 Дасягненні"
