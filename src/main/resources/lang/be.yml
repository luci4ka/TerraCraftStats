  sub-distance-title: "🏃 Дыстанцыя"
  sub-damage-title: "💥 Шкода"
  sub-craft-title: "🔨 Крафт"
  sub-arrows-title: "🏹 Стральба"
  sub-animals-title: "🐾 Жывёлы"
  sub-movement-title: "🌐 Перамяшчэнне"
