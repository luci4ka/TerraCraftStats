# =========================================================================
#                    PlayerStats — Беларуская
# =========================================================================
# Вы можаце рэдагаваць гэты файл. ConfigUpdater дадасць адсутныя ключы.
# НЕ выкарыстоўвайце §-коды — толькі MiniMessage (<red>, <gold>, ...).
# =========================================================================

# ==================== Агульныя ====================
prefix: "<gold>[PlayerStats]</gold> <gray>"
no-permission: "<red>У вас няма правоў для гэтай каманды."
player-not-found: "<red>Гульца '<yellow>{player}</yellow>' не знойдзена."
error: "<red>Адбылася памылка. Праверце кансоль."


# =========================================================================
#                    Каманды — агульныя ключы
# =========================================================================
commands:
  # ===== Агульныя =====
  only-player: "<red>Толькі гулец можа выкарыстоўваць гэтую каманду."
  only-player-short: "<red>Толькі гулец."
  player-not-found: "<red>Гульца '<yellow>{player}</yellow>' не знойдзена."

  # ===== Апісанні камандаў (plain text, без колераў) =====
  descriptions:
    stats: "Прагляд статыстыкі"
    top: "Паказаць топ гульцоў"
    share: "Падзяліцца статыстыкай"
    compare: "Параўнаць статыстыку"
    serverstats: "Статыстыка сервера"
    exclude: "Кіраванне выключэннямі"
    playerstats: "Кіраванне плагінам PlayerStats"
    hologram: "Кіраванне галаграмамі"
    backup: "Кіраванне рэзервовымі копіямі БД"
    rollback: "Адкат статыстыкі"


# =========================================================================
#                    Snapshot
# =========================================================================
snapshot:
  creating: "<yellow>📸 Стварэнне снапшота..."
  success: "<green>✅ Снапшот захаваны."
  error: "<red>❌ Памылка: {error}"


# =========================================================================
#                    Holograms
# =========================================================================
holograms:
  # Кіраванне
  created: "<green>✅ Галаграма створана: <white>{stat}"
  removed: "<green>✅ Галаграма выдалена: <white>{name}"
  list-empty: "<yellow>Няма актыўных галаграм."
  list-header: "<green>Актыўныя галаграмы: <white>{list}"
  reloaded: "<green>✅ Галаграмы перазагружаны."
  module-disabled: "<red>Модуль 'holograms' выключаны ў config.yml."

  # Назвы статаў (для defaultTitle)
  stats:
    play_time: "Час гульні"
    kills: "Забойствы"
    mobs_killed: "Мобы"
    bosses_killed: "Босы"
    blocks_placed: "Пастаўлена блокаў"
    blocks_broken: "Зламана блокаў"
    balance: "Баланс"
    deaths: "Смерці"
    killstreak: "Серыя забойстваў"


# =========================================================================
