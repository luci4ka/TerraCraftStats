  self: "<red>Нельга падзяліцца статыстыкай з самім сабой. Выкарыстоўвайце /stats."

  # ===== Broadcast =====
  broadcast: "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n<gold>📊 <yellow>{chips}{player}</yellow> падзяліўся статыстыкай!\n<gray>Сервер: <aqua>{server}</aqua> <gray>| Група: <light_purple>{group}"
  broadcast-hover: "<gray>Націсніце, каб адкрыць статыстыку\n<gray>Гулец: <white>{player}\n<gray>Сервер: <white>{server}\n<gray>Група: {group}\n<gray>K/D: <white>{kd}"

  stats: "\n<green>⏳ Час: <white>{time} <gray>(усяго: {total-time})\n<green>☠ PvE: <white>Мобы {mobs} | Босы {bosses} <gray>(усяго мобаў: {total-mobs})\n<green>⛏ Блокі: <white>Пастаўлена {blocks}\n<green>⚔ PvP: <white>Забойстваў {kills} | Смерцяў {deaths} <gray>| K/D: {kd}\n<green>💰 Баланс: <gold>{balance}\n<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  # ===== Private =====
  private-sender: "<green>Вы падзяліліся статыстыкай з <yellow>{target}</yellow>"
  private-target: "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n<gold>📊 <yellow>{chips}{player}</yellow> падзяліўся з вамі статыстыкай:\n<gray>Сервер: <aqua>{server}</aqua> <gray>| Група: <light_purple>{group}\n<green>⏳ Час: <white>{time} <gray>(усяго: {total-time})\n<green>☠ PvE: <white>Мобы {mobs} | Босы {bosses}\n<green>⚔ PvP: <white>Забойстваў {kills} | Смерцяў {deaths} <gray>| K/D: {kd}\n<green>💰 Баланс: <gold>{balance}\n<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  private-hover: "<gray>Націсніце, каб адкрыць статыстыку\n<gray>Гулец: <white>{player}\n<gray>K/D: <white>{kd}"

  # ===== K/D =====
  kd-infinite: "∞"
  kd-zero: "0.00"
  kd-format: "%.2f"


# =========================================================================
#                    /exclude — выключэнні
# =========================================================================
exclude:
  added: "<green>✅ Гулец <yellow>{player}</yellow> выключаны са статыстыкі."
  removed: "<green>✅ Гулец <yellow>{player}</yellow> вернуты ў статыстыку."
  already-excluded: "<yellow>Гулец '<white>{player}</white>' ужо выключаны."
  not-excluded: "<yellow>Гулец '<white>{player}</white>' не выключаны."
  never-played: "<red>Гулец '<white>{player}</white>' ніколі не гуляў на серверы."

  # ===== Кнопкі =====
  button-undo: "↩ Адмяніць"
  button-undo-hover: "<gray>Вярнуць <white>{player}</white> у статыстыку"

  button-stats: "👤 Статыстыка"
  button-stats-hover: "<gray>Адкрыць статыстыку <white>{player}"

  # ===== Кнопкі (кароткія, для list) =====
  button-undo-short: "↩"
  button-undo-short-hover: "<gray>Вярнуць <white>{player}</white> у статыстыку"

  button-stats-short: "👤"
  button-stats-short-hover: "<gray>Адкрыць статыстыку <white>{player}"

  # ===== Сімвалы =====
  bullet: "  • "
  separator-bracket-left: "  ["
  separator-bracket-left-short: " ["
  separator-bracket-right: "]"

  list-header: "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━\n<gold>🚫 Выключаныя гульцы (<yellow>{count}</yellow>):"
  list-empty: "<yellow>Няма выключаных гульцоў."
  list-footer: "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━"
  list-entry: "<dark_gray>  • <red>{player}"

  help: |
    <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━
    <gold>🚫 Кіраванне выключэннямі:
    <yellow>/exclude <player> <gray>— выключыць са статыстыкі
    <yellow>/exclude remove <player> <gray>— вярнуць у статыстыку
    <yellow>/exclude list <gray>— спіс выключаных
    <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━


# =========================================================================
#                    /playerstats reload
# =========================================================================
reload:
  header: "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  starting: "<gold>[PlayerStats] 🔄 Пачынаю перазагрузку..."

  # ===== Этапы =====
  step-config: "<green>   ✅</green> <gray>Канфіг перазагружаны"
  step-caches: "<green>   ✅</green> <gray>Кэшы ачышчаны <white>({count})"
  step-groups: "<green>   ✅</green> <gray>Кэш груп ачышчаны"
  step-tops: "<green>   ✅</green> <gray>Кэш топу скінуты"
  step-server: "<green>   ✅</green> <gray>Інфармацыя пра сервер абноўлена"

  # ===== Секцыі =====
  section-config: "<dark_gray>━━ <gold>📦 Канфіг</gold> ━━"
  section-server: "<dark_gray>━━ <gold>🌐 Сервер</gold> ━━"
  section-api: "<dark_gray>━━ <gold>🔌 API</gold> ━━"

  # ===== Інфа =====
  info-db: "<gray>   💾 База даных: <white>{type}"
  info-caches: "<gray>   🗑 Ачышчана кэшаў: <white>{count}"
  info-server: "<gray>   🎯 Імя: <white>{server} <gray>(ID: <white>{id}<gray>)"
  info-multi: "<gray>   🌍 Мультысервернасць: {status}"
  info-api: "<gray>   📡 HTTP API: {status}"
  info-api-host: " <gray>(<white>{host}<gray>)"
  info-api-host-hover: "<gray>Хост: <white>{host}\n<dark_gray>Націсніце, каб скапіраваць"

  # ===== Вынік =====
  success: "<green>✅ Перазагрузка завершана за <white>{time} мс"
  error: "<red>❌ Памылка пры перазагрузцы! Праверце кансоль."


# =========================================================================
#                    /playerstats update
# =========================================================================
update:
  header: "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  available: "<gold>📢 Даступна абнаўленне!"
  current: "<gray>  Бягучая: <white>v{current}"
  latest: "<gray>  Новая: <green>v{latest}"
  download: "<gray>  Спампаваць: <aqua>{url}"
  up-to-date: "<green>✅ Плагін актуальны (v{version})"
  not-initialized: "<red>UpdateChecker не ініцыялізаваны."


# =========================================================================
#                    /playerstats info
# =========================================================================
info:
  header: "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  title: "<gold>📊 PlayerStats <yellow>v{version}"
  author: "<gray>   Аўтар: <white>{authors}"

  # ===== Секцыі =====
  section-server: "<dark_gray>━━ <gold>🌐 Сервер</gold> ━━"
  section-database: "<dark_gray>━━ <gold>💾 База даных</gold> ━━"
  section-hooks: "<dark_gray>━━ <gold>🔗 Інтэграцыі</gold> <gray>({active}/{total})</gray> ━━"
  section-settings: "<dark_gray>━━ <gold>⚙ Налады</gold> ━━"

  # ===== Сервер =====
  server: "<gray>   Імя: <white>{server} <gray>(ID: <white>{id}<gray>)"
  bukkit-server: "<gray>   Bukkit: <white>{name} {version}"

  # ===== База =====
  database: "<gray>   Тып: <white>{type} {status}"

  # ===== API =====
  api: "<gray>   HTTP API: {status}"
  api-host: " <gray>(<white>{host}<gray>)"
  api-host-hover: "<gray>Хост: <white>{host}\n<dark_gray>Націсніце, каб скапіраваць"

  # ===== Інтэграцыі =====
  integrations: "<gray>   Інтэграцыі:"
  hook-enabled: "<gray>   <green>✅ {name}"
  hook-disabled: "<gray>   <red>❌ {name}"
  hook-enabled-hover: "<green>✓ Інтэграцыя актыўная\n<gray>Плагін: <white>{name}"
  hook-disabled-hover: "<red>✗ Інтэграцыя недаступная\n<gray>Плагін: <white>{name}\n<dark_gray>Усталюйце {name} для працы"

  # ===== Налады =====
  debug: "<gray>   Debug: {level}"
  debug-off: "<red>Выкл"
  debug-basic: "<yellow>Базавы"
  debug-detailed: "<green>Дэталёвы"
  debug-unknown: "<gray>Невядома"
  multi: "<gray>   Мультысервернасць: {status}"
  top-chips: "<gray>   Top-chips: {status}"
  sparkline: "<gray>   Sparkline: {status}"
  pvp: "<gray>   PvP-статыстыка: {status}"

  # ===== Hover загалоўка =====
  title-hover: "<gray>Аўтар: <white>{authors}\n<gray>Версія: <white>{version}\n<dark_gray>Плагін статыстыкі для Paper"


# =========================================================================
#                    /playerstats apikey
# =========================================================================
apikey:
  header: "<dark_gray>━━━━━━━━━━ <gold>🔑 API Key</gold> ━━━━━━━━━━"
  current: "<gray>Бягучы ключ: <white>{key}"
  hint: "<dark_gray>Перадавайце ў загалоўку <white>X-API-Key</white> або <white>Authorization: Bearer <key>"
  regenerated: "<green>✅ Новы API-ключ згенераваны."
  warning: "<red>Усе існуючыя кліенты страцяць доступ."
  api-disabled: "<red>API-сервер не запушчаны."
  no-key: "<red>API-ключ не зададзены (auto-generate-key: false)."


# =========================================================================
#                    /playerstats help
# =========================================================================
help:
  header: "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  title: "<gold>📊 PlayerStats <yellow>— Даведка"
  available: "<gray>   Даступна камандаў: <yellow>{count}"

  # ===== Секцыі =====
  section-stats: "<dark_gray>━━ <gold>📊 Статыстыка</gold> ━━"
  section-tops: "<dark_gray>━━ <gold>🏆 Топы</gold> ━━"
  section-social: "<dark_gray>━━ <gold>📤 Сацыяльнае</gold> ━━"
  section-admin: "<dark_gray>━━ <gold>⚙ Кіраванне</gold> ━━"

  # ===== Каманды =====
  commands-title: "<gold>Каманды:"

  # Stats
  command-stats: "<yellow>   /stats <gray>— свая статыстыка"
  command-stats-other: "<yellow>   /stats <player> <gray>— статыстыка гульца"
  command-stats-gui: "<yellow>   /stats gui <gray>— GUI са статыстыкай"
  command-stats-pvp: "<yellow>   /stats pvp [player] <gray>— PvP-статыстыка"
  command-stats-rollback: "<yellow>   /stats rollback <player> <stat> <value> <gray>— адкат статы"

  # Tops
  command-top: "<yellow>   /top <gray>— топы сервера"
  command-top-stat: "<yellow>   /top <stat> <gray>— топ па статыстыцы"
  command-top-pvp: "<yellow>   /top pvp <нік> <gray>— топ забойцаў гульца"

  # Social
  command-share: "<yellow>   /share [player] <gray>— падзяліцца статыстыкай"
  command-compare: "<yellow>   /compare <player> <gray>— параўнаць статыстыку"

  # Admin
  command-exclude: "<yellow>   /exclude <player> [remove|list] <gray>— выключэнні"
  command-reload: "<yellow>   /playerstats reload <gray>— перазагрузка"
  command-snapshot: "<yellow>   /playerstats snapshot <gray>— стварыць снапшот"
  command-backup: "<yellow>   /playerstats backup [now|list|restore] <gray>— рэзервовыя копіі БД"
  command-hologram: "<yellow>   /playerstats hologram <gray>— кіраванне галаграмамі"
  command-info: "<yellow>   /playerstats info <gray>— інфармацыя пра плагін"
  command-apikey: "<yellow>   /playerstats apikey [regenerate] <gray>— API-ключ"
  command-update: "<yellow>   /playerstats update <gray>— праверыць абнаўленні"

  # ===== Пусты вывад =====
  no-commands: "<gray>   У вас няма доступу ні да адной каманды."

  # ===== Hover-падсказкі =====
  hover-stats: "<gray>Паказвае вашу статыстыку\n<dark_gray>Прыклад: <white>/stats"
  hover-stats-gui: "<gray>Адкрывае GUI са статыстыкай\n<dark_gray>Прыклад: <white>/stats gui"
  hover-stats-other: "<gray>Статыстыка іншага гульца\n<dark_gray>Прыклад: <white>/stats Steve"
  hover-stats-pvp: "<gray>Спіс забітых гульцоў (PvP)\n<dark_gray>Прыклад: <white>/stats pvp Steve"
  hover-stats-rollback: "<gray>Адкат статыстыкі гульца\n<dark_gray>Прыклад: <white>/stats rollback Steve kills 0"

  hover-top: "<gray>Топы сервера па катэгорыях\n<dark_gray>Прыклад: <white>/top"
  hover-top-stat: "<gray>Топ па канкрэтнай статыстыцы\n<dark_gray>Прыклад: <white>/top kills"
  hover-top-pvp: "<gray>Топ забойцаў канкрэтнага гульца\n<dark_gray>Прыклад: <white>/top pvp Steve"

  hover-share: "<gray>Падзяліцца статыстыкай у чат\n<dark_gray>Прыклад: <white>/share\n<dark_gray>Прыклад: <white>/share Steve"
  hover-compare: "<gray>Параўнаць статыстыку з іншым гульцом\n<dark_gray>Прыклад: <white>/compare Steve"

  hover-exclude: "<gray>Кіраванне выключэннямі са статыстыкі\n<dark_gray>Прыклад: <white>/exclude Steve\n<dark_gray>Прыклад: <white>/exclude list"
  hover-reload: "<gray>Перазагрузіць канфіг і кэшы\n<dark_gray>Прыклад: <white>/playerstats reload"
  hover-snapshot: "<gray>Стварыць снапшот статыстыкі\n<dark_gray>Прыклад: <white>/playerstats snapshot"
  hover-backup: "<gray>Кіраванне рэзервовымі копіямі БД\n<dark_gray>Прыклад: <white>/playerstats backup now"
  hover-hologram: "<gray>Кіраванне галаграмамі\n<dark_gray>Прыклад: <white>/playerstats hologram list"
  hover-info: "<gray>Інфармацыя пра плагін і інтэграцыі\n<dark_gray>Прыклад: <white>/playerstats info"
  hover-apikey: "<gray>Паказаць/згенераваць API-ключ\n<dark_gray>Прыклад: <white>/playerstats apikey"
  hover-update: "<gray>Праверыць абнаўленні плагіна\n<dark_gray>Прыклад: <white>/playerstats update"

  footer: "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"


# =========================================================================
#                    Валюта
# =========================================================================
currency:
  # Fallback-фармат, калі Vault не падключаны.
  # {value} — адфарматаваны лік (напрыклад, 1500.00)
  format: "{value}₽"


# =========================================================================
#                    Рэзервовыя копіі БД
# =========================================================================
backup:
  starting: "<yellow>📦 Стварэнне рэзервовай копіі БД..."
  done: "<green>✅ Рэзервовая копія створана."
  error: "<red>❌ Памылка рэзервовай копіі. Праверце кансоль."

  usage: |-
    <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━
    <gold>📦 Кіраванне рэзервовымі копіямі:
    <yellow>/playerstats backup <gray>— стварыць зараз
    <yellow>/playerstats backup list <gray>— спіс
    <yellow>/playerstats backup restore <file> <gray>— аднавіць
    <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━

  list-empty: "<yellow>Няма захаваных рэзервовых копій."
  list-header: "<gold>📦 Рэзервовыя копіі (<white>{count}<gold>):"
  list-entry: "<gray>  • <white>{file} <dark_gray>({size})"

  restore-usage: "<red>Выкарыстанне: <yellow>/playerstats backup restore <file>"
  restore-starting: "<yellow>⏳ Аднаўленне з <white>{file}</white>..."
  restore-done: "<green>✅ БД адноўлена з <white>{file}</white>. <red>Перазапусціце сервер!"
  restore-error: "<red>❌ Не ўдалося аднавіць з <white>{file}</white>."
  module-disabled: "<red>Модуль 'backup' выключаны ў config.yml."


# =========================================================================
#                    Адкат статыстыкі
# =========================================================================
rollback:
  usage: |-
    <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━
    <gold>🔄 Адкат статыстыкі:
    <yellow>/stats rollback <player> <stat> <value> <gray>— усталяваць значэнне
    <yellow>/stats rollback <player> --all <value> <gray>— абнуліць усё
    <yellow>/stats rollback <player> --from <date> <stat> <gray>— адкат з даты
    <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━

  done: "<green>✅ <white>{player}</white>: <yellow>{stat}</yellow> = <white>{value}"
  done-all: "<green>✅ <white>{player}</white>: усе статы абнулены (<white>{count}</white> запісаў)"
  done-from: "<green>✅ <white>{player}</white>: <yellow>{stat}</yellow> адкат на <white>{delta}</white> → <white>{value}"

  notify: "<red>⚠ Ваша статыстыка <yellow>{stat}</yellow> была зменена адміністратарам: <white>{value}"
  notify-all: "<red>⚠ Ваша статыстыка была скінута адміністратарам (значэнне: <white>{value}<red>)"

  never-played: "<red>Гулец <yellow>{player}</yellow> ніколі не гуляў на серверы."
  invalid-value: "<red>Няправільнае значэнне: <white>{value}"
  invalid-date: "<red>Няправільная дата: <white>{date}"
  error: "<red>❌ Памылка адкату. Праверце кансоль."


# =========================================================================
#                    Утыліты
# =========================================================================
status:
  enabled: "<green>Уключана"
  disabled: "<red>Выключана"
  enabled-f: "<green>Уключана"
  disabled-f: "<red>Выключана"
  connected: "<green>✅"
  disconnected: "<red>❌"

time:
  seconds: "{seconds}с"
  minutes: "{minutes}хв"
  hours: "{hours}г {minutes}хв"
  times:
    one: "раз"
    few: "разы"
    many: "разоў"