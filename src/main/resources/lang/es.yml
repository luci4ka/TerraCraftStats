# =========================================================================
#                    Moneda
# =========================================================================
currency:
  # Formato fallback si Vault no está conectado.
  # {value} — número formateado (por ejemplo, 1500.00)
  format: "{value}€"


# =========================================================================
#                    Copia de seguridad de la BD
# =========================================================================
backup:
  starting: "<yellow>📦 Creando copia de seguridad de la BD..."
  done: "<green>✅ Copia de seguridad creada."
  error: "<red>❌ Error de copia de seguridad. Revisa la consola."

  usage: |-
    <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━
    <gold>📦 Gestión de copias de seguridad:
    <yellow>/playerstats backup <gray>— crear ahora
    <yellow>/playerstats backup list <gray>— listar
    <yellow>/playerstats backup restore <file> <gray>— restaurar
    <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━

  list-empty: "<yellow>No hay copias de seguridad guardadas."
  list-header: "<gold>📦 Copias de seguridad (<white>{count}<gold>):"
  list-entry: "<gray>  • <white>{file} <dark_gray>({size})"

  restore-usage: "<red>Uso: <yellow>/playerstats backup restore <file>"
  restore-starting: "<yellow>⏳ Restaurando desde <white>{file}</white>..."
  restore-done: "<green>✅ Base de datos restaurada desde <white>{file}</white>. <red>¡Reinicia el servidor!"
  restore-error: "<red>❌ No se pudo restaurar desde <white>{file}</white>."
  module-disabled: "<red>El módulo 'backup' está desactivado en config.yml."


# =========================================================================
#                    Reversión de estadísticas
# =========================================================================
rollback:
  usage: |-
    <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━
    <gold>🔄 Reversión de estadísticas:
    <yellow>/stats rollback <player> <stat> <value> <gray>— establecer valor
    <yellow>/stats rollback <player> --all <value> <gray>— restablecer todo
    <yellow>/stats rollback <player> --from <date> <stat> <gray>— revertir desde fecha
    <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━

  done: "<green>✅ <white>{player}</white>: <yellow>{stat}</yellow> = <white>{value}"
  done-all: "<green>✅ <white>{player}</white>: todas las stats restablecidas (<white>{count}</white> registros)"
  done-from: "<green>✅ <white>{player}</white>: <yellow>{stat}</yellow> revertida en <white>{delta}</white> → <white>{value}"

  notify: "<red>⚠ Tu stat <yellow>{stat}</yellow> fue cambiada por un admin: <white>{value}"
  notify-all: "<red>⚠ Tus stats fueron restablecidas por un admin (valor: <white>{value}<red>)"

  never-played: "<red>El jugador <yellow>{player}</yellow> nunca jugó en este servidor."
  invalid-value: "<red>Valor inválido: <white>{value}"
  invalid-date: "<red>Fecha inválida: <white>{date}"
  error: "<red>❌ Error de reversión. Revisa la consola."


# =========================================================================
#                    Utilidades
# =========================================================================
status:
  enabled: "<green>Activado"
  disabled: "<red>Desactivado"
  enabled-f: "<green>Activada"
  disabled-f: "<red>Desactivada"
  connected: "<green>✅"
  disconnected: "<red>❌"

time:
  seconds: "{seconds}s"
  minutes: "{minutes}m"
  hours: "{hours}h {minutes}m"
  times:
    one: "vez"
    few: "veces"
    many: "veces"