# =========================================================================
#                    PlayerStats — Español
# =========================================================================
# Puedes editar este archivo. ConfigUpdater añadirá las claves faltantes.
# NO uses códigos § — solo MiniMessage (<red>, <gold>, ...).
# =========================================================================

# ==================== General ====================
prefix: "<gold>[PlayerStats]</gold> <gray>"
no-permission: "<red>No tienes permiso para usar este comando."
player-not-found: "<red>Jugador '<yellow>{player}</yellow>' no encontrado."
error: "<red>Ocurrió un error. Revisa la consola."


# =========================================================================
#                    Comandos — claves comunes
# =========================================================================
commands:
  only-player: "<red>Solo un jugador puede usar este comando."
  only-player-short: "<red>Solo jugadores."
  player-not-found: "<red>Jugador '<yellow>{player}</yellow>' no encontrado."

  descriptions:
    stats: "Ver estadísticas"
    top: "Mostrar clasificaciones"
    share: "Compartir estadísticas"
    compare: "Comparar estadísticas"
    serverstats: "Estadísticas del servidor"
    exclude: "Gestionar exclusiones"
    playerstats: "Gestionar el plugin PlayerStats"


# =========================================================================
#                    Status
# =========================================================================
status:
  enabled: "<green>Activado"
  disabled: "<red>Desactivado"
  enabled-f: "<green>Activada"
  disabled-f: "<red>Desactivada"
  connected: "<green>✅"
  disconnected: "<red>❌"


# =========================================================================
#                    Tiempo / K/D / Moneda
# =========================================================================
time:
  seconds: "{seconds}s"
  minutes: "{minutes}m"
  hours: "{hours}h {minutes}m"
  times:
    one: "vez"
    few: "veces"
    many: "veces"

  suffix:
    days: "d"
    hours: "h"
    minutes: "m"
  less-than-minute: "<1m"

kd:
  format: "%.2f"
  infinite: "∞"
  zero: "0.00"

currency:
  # Formato fallback si Vault no está conectado.
  # {value} — número formateado (por ejemplo, 1500.00)
  format: "{value}€"


# =========================================================================
#                    Snapshot
# =========================================================================
snapshot:
  creating: "<yellow>📸 Creando snapshot..."
  success: "<green>✅ Snapshot guardado."
  error: "<red>❌ Error: {error}"


# =========================================================================
#                    /stats — estadísticas del jugador
# =========================================================================
stats:
  header: "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  title-self: "<gold>📊 {chips}Estadísticas en el servidor <aqua>{server}</aqua>"
  title-other: "<gold>📊 {chips}Estadísticas de <yellow>{player}</yellow> en <aqua>{server}</aqua>"

  blocks: "<green>🧱 Bloques  <white>Colocados: {placed} | Rotos: {broken}"
  pve: "<green>☠ PvE  <white>Mobs: {mobs} | Jefes: {bosses}"
  time: "<green>⏳ Tiempo  <white>{time}"
  pvp: "<green>⚔ PvP  <white>Bajas: {kills} | Muertes: {deaths} | <gold>K/D: {kd}"
  balance: "<green>💰 Balance  <white>{value}"
  balance-hover: "<gray>Balance actual"
  group: "<green>🎖 Grupo  {value}"
  group-hover: "<gray>Grupo actual"

  sparkline: "<dark_gray>  📈 <gray>Progreso ({days}d): <white>{graph}"

  share-button: "<green>  [📤 Compartir estadísticas]"
  share-hover: "<gray>Clic para enviar tus estadísticas al chat"

  hint-subcommands: "<gray>Detalles: <yellow>/stats pvp <gray>| <yellow>/stats mob <gray>| <yellow>/stats block"

  pvp-title-self: "<yellow>⚔ <white>Tus estadísticas PvP <gray>| <green>Bajas: <white>{kills} <gray>| <red>Muertes: <white>{deaths} <gray>| <gold>K/D: <white>{kd}"
  pvp-title-other: "<yellow>⚔ <white>Estadísticas PvP de <yellow>{player} <gray>| <green>Bajas: <white>{kills} <gray>| <red>Muertes: <white>{deaths} <gray>| <gold>K/D: <white>{kd}"
  pvp-header: "<gray>Jugadores asesinados: <white>{count}"
  pvp-empty: "<gray>Sin datos de PvP."

  pvp-entry: "<red>  ☠ <yellow>{player} <gray>— <white>{count} {times}"
  pvp-entry-hover: "<gray>Clic para ver las estadísticas de <white>{player}\n<gray>UUID: <dark_gray>{uuid}"

  mob-title-self: "<yellow>☠ <white>Tus estadísticas PvE <gray>| <green>Mobs: <white>{mobs} <gray>| <gold>Jefes: <white>{bosses}"
  mob-title-other: "<yellow>☠ <white>Estadísticas PvE de <yellow>{player} <gray>| <green>Mobs: <white>{mobs} <gray>| <gold>Jefes: <white>{bosses}"
  mob-header: "<gray>Tipos de mobs asesinados: <white>{count}"
  mob-empty: "<gray>Sin datos de mobs."
  mob-entry: "<dark_red>  ☠ <yellow>{name} <gray>— <white>{count} {unit}"

  block-title-self: "<yellow>🧱 <white>Tus estadísticas de bloques <gray>| <green>Colocados: <white>{placed} <gray>| <red>Rotos: <white>{broken}"
  block-title-other: "<yellow>🧱 <white>Estadísticas de bloques de <yellow>{player} <gray>| <green>Colocados: <white>{placed} <gray>| <red>Rotos: <white>{broken}"
  block-placed-header: "<green>🏗 Colocados (<white>{count}<green> tipos):"
  block-broken-header: "<gold>⛏ Rotos (<white>{count}<gold> tipos):"
  block-empty: "<gray>Sin datos."

  block-placed-entry: "<green>  🏗 <yellow>{name} <gray>— <white>{count} {unit}"
  block-broken-entry: "<gold>  ⛏ <yellow>{name} <gray>— <white>{count} {unit}"

  unit-pieces: "uds"

  pagination-prev-hover: "<gray>Página {page}"
  pagination-next-hover: "<gray>Página {page}"


# =========================================================================
