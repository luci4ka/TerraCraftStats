  title: "<gold>📊 Comparación: <yellow>{player1}</yellow> <gray>vs</gray> <yellow>{player2}</yellow>"

  button: "<aqua>[👤 {player}]</aqua>"
  button-hover: "<gray>Abrir estadísticas de <white>{player}"

  winner: "   <yellow>🏆 Ganador: <gold>{winner}</gold> <gray>({wins1} : {wins2})"
  draw: "   <gray>🤝 ¡Empate! ({wins1} : {wins2})"

  line-blocks: "📊 Bloques"
  line-pve: "☠ PvE"
  line-time: "⏳ Tiempo"
  line-pvp: "⚔ PvP"
  line-kd: "   K/D"
  line-balance: "💰 Balance"

  hover-value-1: "<gray>Valor 1: <white>{value}"
  hover-value-2: "<gray>Valor 2: <white>{value}"
  hover-diff: "<gray>Diferencia: <white>{diff}"


# =========================================================================
#                    /share — compartir
# =========================================================================
share:
  self: "<red>No puedes compartir estadísticas contigo mismo. Usa /stats."

  broadcast: "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n<gold>📊 <yellow>{chips}{player}</yellow> ¡compartió sus estadísticas!\n<gray>Servidor: <aqua>{server}</aqua> <gray>| Grupo: <light_purple>{group}"
  broadcast-hover: "<gray>Clic para ver las estadísticas\n<gray>Jugador: <white>{player}\n<gray>Servidor: <white>{server}\n<gray>Grupo: {group}\n<gray>K/D: <white>{kd}"

  stats: "\n<green>⏳ Tiempo: <white>{time} <gray>(total: {total-time})\n<green>☠ PvE: <white>Mobs {mobs} | Jefes {bosses} <gray>(total mobs: {total-mobs})\n<green>⛏ Bloques: <white>Colocados {blocks}\n<green>⚔ PvP: <white>Bajas {kills} | Muertes {deaths} <gray>| K/D: {kd}\n<green>💰 Balance: <gold>{balance}\n<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  private-sender: "<green>Compartiste tus estadísticas con <yellow>{target}</yellow>"
  private-target: "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n<gold>📊 <yellow>{chips}{player}</yellow> compartió sus estadísticas contigo:\n<gray>Servidor: <aqua>{server}</aqua> <gray>| Grupo: <light_purple>{group}\n<green>⏳ Tiempo: <white>{time} <gray>(total: {total-time})\n<green>☠ PvE: <white>Mobs {mobs} | Jefes {bosses}\n<green>⚔ PvP: <white>Bajas {kills} | Muertes {deaths} <gray>| K/D: {kd}\n<green>💰 Balance: <gold>{balance}\n<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
  private-hover: "<gray>Clic para ver las estadísticas\n<gray>Jugador: <white>{player}\n<gray>K/D: <white>{kd}"


# =========================================================================
#                    /serverstats — estadísticas del servidor
# =========================================================================
serverstats:
  title: "<gold>📊 Estadísticas del servidor <aqua>{server}</aqua>"

  section-players: "<dark_gray>━━ <gold>👥 Jugadores</gold> ━━"
  section-activity: "<dark_gray>━━ <gold>📊 Actividad</gold> ━━"
  section-blocks: "<dark_gray>━━ <gold>🧱 Bloques</gold> ━━"
  section-economy: "<dark_gray>━━ <gold>💰 Economía</gold> ━━"

  unique-players: "   <green>👤 Jugadores únicos: <white>{value}"
  line: "   <green>{value}"
  line-time: "   <green>⏳ Tiempo total de juego: <white>{value}"
  line-balance: "   <green>💵 Balance total: <gold>{value}"

  stat-playtime-hover: "<gray>Tiempo total de juego de todos los jugadores"
  stat-mobs-hover: "<gray>Bajas totales de mobs"
  stat-bosses-hover: "<gray>Bajas totales de jefes"
  stat-kills-hover: "<gray>Bajas PvP totales"
  stat-deaths-hover: "<gray>Muertes totales de jugadores"
  stat-blocks-placed-hover: "<gray>Bloques colocados en total"
  stat-blocks-broken-hover: "<gray>Bloques rotos en total"
  stat-balance-hover: "<gray>Balance total de todos los jugadores"
