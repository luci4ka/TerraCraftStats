# =========================================================================
#                    /exclude — exclusiones
# =========================================================================
exclude:
  added: "<green>✅ Jugador <yellow>{player}</yellow> excluido de las estadísticas."
  removed: "<green>✅ Jugador <yellow>{player}</yellow> devuelto a las estadísticas."
  already-excluded: "<yellow>El jugador '<white>{player}</white>' ya está excluido."
  not-excluded: "<yellow>El jugador '<white>{player}</white>' no está excluido."
  never-played: "<red>El jugador '<white>{player}</white>' nunca jugó en este servidor."

  button-undo: "↩ Deshacer"
  button-undo-hover: "<gray>Devolver <white>{player}</white> a las estadísticas"

  button-stats: "👤 Estadísticas"
  button-stats-hover: "<gray>Abrir estadísticas de <white>{player}"

  button-undo-short: "↩"
  button-undo-short-hover: "<gray>Devolver <white>{player}</white> a las estadísticas"

  button-stats-short: "👤"
  button-stats-short-hover: "<gray>Abrir estadísticas de <white>{player}"

  bullet: "  • "
  separator-bracket-left: "  ["
  separator-bracket-left-short: " ["
  separator-bracket-right: "]"

  list-header: "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━\n<gold>🚫 Jugadores excluidos (<yellow>{count}</yellow>):"
  list-empty: "<yellow>No hay jugadores excluidos."
  list-footer: "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━"
