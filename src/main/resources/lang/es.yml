  sub-damage-title: "💥 Daño"
  sub-craft-title: "🔨 Crafteo"
  sub-arrows-title: "🏹 Tiro"
  sub-animals-title: "🐾 Animales"
  sub-movement-title: "🌐 Movimiento"
  sub-economy-title: "💰 Economía"

