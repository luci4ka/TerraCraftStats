# =========================================================================
#                    PlayerStats — Español
# =========================================================================
# Puedes editar este archivo. ConfigUpdater añadirá las claves faltantes.
# NO uses códigos § — solo MiniMessage (<red>, <gold>, ...).
# =========================================================================

# ==================== General ====================
prefix: "<gold>[PlayerStats]</gold> <gray>"
no-permission: "<red>No tienes permiso para usar este comando."
player-not-found: "<red>Jugador '<yellow>{player}</yellow>' no encontrado."
error: "<red>Ocurrió un error. Revisa la consola."


# =========================================================================
#                    Comandos — claves comunes
# =========================================================================
commands:
  # ===== Comunes =====
  only-player: "<red>Solo un jugador puede usar este comando."
  only-player-short: "<red>Solo jugadores."
  player-not-found: "<red>Jugador '<yellow>{player}</yellow>' no encontrado."

  # ===== Descripciones de comandos (texto plano, sin colores) =====
  descriptions:
    stats: "Ver estadísticas"
    top: "Mostrar clasificaciones"
    share: "Compartir estadísticas"
    compare: "Comparar estadísticas"
    serverstats: "Estadísticas del servidor"
    exclude: "Gestionar exclusiones"
    playerstats: "Gestionar el plugin PlayerStats"
    hologram: "Gestionar hologramas"
    backup: "Gestionar copias de seguridad de la BD"
    rollback: "Revertir estadísticas"


# =========================================================================
#                    Snapshot
# =========================================================================
snapshot:
  creating: "<yellow>📸 Creando snapshot..."
  success: "<green>✅ Snapshot guardado."
  error: "<red>❌ Error: {error}"


# =========================================================================
#                    Holograms
# =========================================================================
holograms:
  # Gestión
  created: "<green>✅ Holograma creado: <white>{stat}"
  removed: "<green>✅ Holograma eliminado: <white>{name}"
  list-empty: "<yellow>No hay hologramas activos."
  list-header: "<green>Hologramas activos: <white>{list}"
  reloaded: "<green>✅ Hologramas recargados."
  module-disabled: "<red>El módulo 'holograms' está desactivado en config.yml."

  # Nombres de stats (para defaultTitle)
  stats:
    play_time: "Tiempo de juego"
    kills: "Bajas"
    mobs_killed: "Mobs"
    bosses_killed: "Jefes"
    blocks_placed: "Bloques colocados"
    blocks_broken: "Bloques rotos"
    balance: "Balance"
    deaths: "Muertes"
    killstreak: "Racha"


# =========================================================================
#                    Stats GUI
# =========================================================================
stats-gui:
  # ===== Título =====
  title: "<dark_gray>📊 Estadísticas"

  # ===== Pestañas =====
  tab-main: "<gold>🏠 Principal"
  tab-main-hover: "<gray>Categorías principales"

  tab-pvp: "<yellow>⚔ PvP"
  tab-pvp-hover: "<gray>Bajas y muertes"

  tab-achievements: "<gold>🏆 Logros <green>({unlocked}/{total})"
  tab-achievements-hover: "<gray>Tu progreso de logros\n<gray>Desbloqueados: <green>{unlocked}\n<gray>Total: <white>{total}\n\n<green>▶ Clic para ver"

  # ===== Botones =====
  back: "<yellow>◀ Atrás"
  back-hover: "<gray>Volver a las estadísticas principales"

  close: "<red>Cerrar"
  close-hover: "<gray>Clic para cerrar"

  # ===== Botón «Detalles» =====
  click-details: "<green>▶ Clic para más detalles"

  # ===== Principal: Categorías =====
  cat-blocks: "<yellow>🧱 Bloques"
  cat-blocks-lore: "<gray>Colocados: <white>{placed}\n<gray>Rotos: <white>{broken}\n<gray>Total: <white>{total}"

  cat-pve: "<yellow>☠ PvE"
  cat-pve-lore: "<gray>Mobs: <white>{mobs}\n<gray>Jefes: <white>{bosses}"

  cat-time: "<yellow>⏳ Tiempo"
  cat-time-lore: "<gray>Jugado: <white>{time}\n<gray>Inicios: <white>{logins}"

  cat-pvp: "<yellow>⚔ PvP"
  cat-pvp-lore: "<gray>Bajas: <white>{kills}\n<gray>Muertes: <white>{deaths}\n<gray>K/D: <white>{kd}"
  cat-pvp-lore-with-players: "<gray>Bajas: <white>{kills}\n<gray>Muertes: <white>{deaths}\n<gray>K/D: <white>{kd}\n\n<gray>Jugadores únicos asesinados: <white>{unique}"

  cat-killstreak: "<yellow>🔥 Racha"
  cat-killstreak-lore: "<gray>Actual: <white>{current}\n<gray>Mejor: <white>{best}\n\n<dark_gray>Racha de bajas sin morir"

  cat-distance: "<yellow>🏃 Distancia"
  cat-distance-lore: "<gray>Recorrido: <white>{value} bloques\n\n<dark_gray>Total recorrido"

  cat-damage: "<yellow>💥 Daño"
  cat-damage-lore: "<gray>Infligido: <white>{dealt}\n<gray>Recibido: <white>{taken}\n\n<dark_gray>Daño total"

  cat-craft: "<yellow>🔨 Crafteo"
  cat-craft-lore: "<gray>Fabricado: <white>{crafted}\n<gray>Comida consumida: <white>{food}\n\n<dark_gray>Total creado"

  cat-arrows: "<yellow>🏹 Tiro"
  cat-arrows-lore: "<gray>Flechas: <white>{arrows}\n<gray>Peces pescados: <white>{fish}"

  cat-animals: "<yellow>🐾 Animales"
  cat-animals-lore: "<gray>Domesticados: <white>{tamed}\n<gray>Criados: <white>{bred}"

  cat-movement: "<yellow>🌐 Movimiento"
  cat-movement-lore: "<gray>Teletransportes: <white>{teleports}\n<gray>Portales: <white>{portals}"

  cat-economy: "<yellow>💰 Economía"
  cat-economy-lore: "<gray>Balance: <gold>{balance}\n<gray>Grupo: {group}"

  # ===== Subpáginas — títulos =====
  sub-pvp-title: "Bajas de jugadores"
  sub-mobs-title: "Bajas de mobs"
  sub-blocks-placed-title: "Bloques colocados"
  sub-blocks-broken-title: "Bloques rotos"

  sub-killstreak-title: "🔥 Racha"
  sub-distance-title: "🏃 Distancia"
  sub-damage-title: "💥 Daño"
  sub-craft-title: "🔨 Crafteo"
  sub-arrows-title: "🏹 Tiro"
  sub-animals-title: "🐾 Animales"
  sub-movement-title: "🌐 Movimiento"
  sub-economy-title: "💰 Economía"

  # ===== Subpáginas — descripciones =====
  sub-killstreak-desc: "<gray>Racha de bajas sin morir.\n<gray>Mata a N jugadores seguidos — la racha crece.\n<dark_gray>Si mueres — la racha se reinicia."
  sub-distance-desc: "<gray>Cuántos bloques has recorrido.\n<dark_gray>Caminar, correr, nadar cuentan."
  sub-damage-desc: "<gray>Cuánto daño has infligido y recibido.\n<dark_gray>Daño en PvP y PvE."
  sub-craft-desc: "<gray>Cuántos objetos has fabricado.\n<dark_gray>Solo los creados en mesa de trabajo."
  sub-arrows-desc: "<gray>Cuántas flechas has disparado y peces pescado.\n<dark_gray>Arco y caña cuentan."
  sub-animals-desc: "<gray>Cuántos animales has domesticado y criado.\n<dark_gray>Perros, gatos, caballos, etc."
  sub-movement-desc: "<gray>Cuántas veces te has teletransportado y usado portales.\n<dark_gray>Todos los tipos cuentan."
  sub-economy-desc: "<gray>Tu balance y grupo.\n<dark_gray>Balance desde Vault."

  # ===== Subpáginas — encabezados de sección =====
  sub-stat-current: "<gray>Actual: <white>{value}"
  sub-stat-best: "<gray>Mejor: <white>{value}"
  sub-stat-dealt: "<gray>Infligido: <white>{value}"
  sub-stat-taken: "<gray>Recibido: <white>{value}"
  sub-stat-crafted: "<gray>Fabricado: <white>{value}"
  sub-stat-food: "<gray>Consumido: <white>{value}"
  sub-stat-arrows: "<gray>Flechas: <white>{value}"
  sub-stat-fish: "<gray>Peces: <white>{value}"
  sub-stat-tamed: "<gray>Domesticados: <white>{value}"
  sub-stat-bred: "<gray>Criados: <white>{value}"
  sub-stat-teleports: "<gray>Teletransportes: <white>{value}"
  sub-stat-portals: "<gray>Portales: <white>{value}"
  sub-stat-kd: "<gray>K/D: <white>{value}"

  # ===== Subpáginas — líneas =====
  sub-total-types: "<gray>Tipos totales: <white>{count}"
  sub-player-head-lore: "<gray>Bajas: <white>{count}\n<gray>UUID: <dark_gray>{uuid}"
  sub-item-lore: "<gray>Valor: <white>{value}\n<gray>Clave: <dark_gray>{key}"

  sub-player-prefix: "<yellow>☠ "
  sub-item-prefix: "<yellow>"

  # ===== Paginación =====
  page-prev: "<green>◀ Anterior"
  page-prev-hover: "<gray>Página {page} / {total}"
  page-next: "<green>Siguiente ▶"
  page-next-hover: "<gray>Página {page} / {total}"

  # ===== Errores =====
  error-loading: "<red>Error al cargar las estadísticas."


# =========================================================================
#                    Achievements GUI
# =========================================================================
achievements-gui:
  title: "<dark_gray>🏆 Logros"


# =========================================================================
#                    Achievements — logros
# =========================================================================
achievements:
  # ===== GUI =====
  title: "<gold>🏆 Logros"

  header:
    name: "<gold>🏆 Logros"
    unlocked: "<gray>Desbloqueados: <green>{unlocked}</green><gray>/<white>{total}"
    percent: "<gray>Progreso: <yellow>{percent}%"
    bar: "<dark_gray>{bar}"
    hint: "<dark_gray>¡Consigue logros jugando!"

  # ===== Estados =====
  status-prefix-unlocked: "<green>✓ "
  status-prefix-locked: "<red>✗ "
  status-unlocked: "<green>✓ Desbloqueado"
  status-locked: "<red>✗ Bloqueado"
  date: "<dark_gray>  {date}"

  # ===== Líneas =====
  category: "<dark_gray>▸ <gray>Categoría: <yellow>{category}"
  progress: "<dark_gray>▸ <gray>Progreso: {color}{current}<gray>/<white>{required} <dark_gray>(<yellow>{percent}%<dark_gray>)"
  progress-bar: "<dark_gray>  {bar}"
  requires: "<dark_gray>▸ <gray>Requerido: <white>{stat} <dark_gray>(<white>{required}<dark_gray>)"

  # ===== Logros temporales =====
  reset:
    label: "<dark_gray>▸ <gray>Reinicio: <yellow>{period}"
    reward-repeatable: "<dark_gray>▸ <gray>Recompensa: <green>repetible"
    reward-once: "<dark_gray>▸ <gray>Recompensa: <red>única"
    in: "<dark_gray>▸ <gray>Próximo reinicio: <white>en {time}"
    ready: "<dark_gray>▸ <gray>Próximo reinicio: <green>listo"
    not-started: "<dark_gray>▸ <gray>Próximo reinicio: <dark_gray>no iniciado"

    # Nombres de períodos (clave = ac.reset())
    daily: "diario"
    weekly: "semanal"
    monthly: "mensual"

  # ===== Botones =====
  back: "<yellow>◀ Atrás"
  back-hover: "<gray>Volver a las estadísticas"

  # ===== Errores =====
  error-loading: "<red>Error al cargar los logros."

  # ===== Formato de fecha (Java SimpleDateFormat) =====
  date-format: "dd/MM/yyyy HH:mm"

  # ===== Color de descripción (opcional) =====
  description-color: "<gray>"

  # ===== Mensajes =====
