  category-mobs: "<yellow>▸ ☠ Mobs asesinados"
  category-blocks: "<yellow>▸ ⛏ Bloques colocados"
  category-pvp: "<yellow>▸ ⚔ PvP (bajas de jugadores)"
  category-balance: "<yellow>▸ 💰 Balance"

  category-pvp-victim: "<yellow>⚔ Bajas de <white>{victim}"
  category-custom: "<yellow>▸ Top: <white>{stat}"

  no-data: "<gray>   Sin datos"
