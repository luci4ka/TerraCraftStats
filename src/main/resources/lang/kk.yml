# =========================================================================
#                    PlayerStats — Қазақша
# =========================================================================
# Бұл файлды өңдеуге болады. ConfigUpdater жетіспейтін кілттерді қосады.
# §-кодтарды ҚОЛДАНБАҢЫЗ — тек MiniMessage (<red>, <gold>, ...).
# =========================================================================

# ==================== Жалпы ====================
prefix: "<gold>[PlayerStats]</gold> <gray>"
no-permission: "<red>Сізде бұл командаға рұқсат жоқ."
player-not-found: "<red>Ойыншы '<yellow>{player}</yellow>' табылмады."
error: "<red>Қате орын алды. Консольді тексеріңіз."


# =========================================================================
#                    Командалар — жалпы кілттер
# =========================================================================
commands:
  # ===== Жалпы =====
  only-player: "<red>Бұл команданы тек ойыншы қолдана алады."
  only-player-short: "<red>Тек ойыншы."
  player-not-found: "<red>Ойыншы '<yellow>{player}</yellow>' табылмады."

  # ===== Команда сипаттамалары (қарапайым мәтін, түссіз) =====
  descriptions:
    stats: "Статистиканы қарау"
    top: "Ойыншылар топтарын көрсету"
    share: "Статистикамен бөлісу"
    compare: "Статистиканы салыстыру"
    serverstats: "Сервер статистикасы"
    exclude: "Алып тастауды басқару"
    playerstats: "PlayerStats плагинін басқару"
    hologram: "Голограммаларды басқару"
    backup: "Дерекқор сақтық көшірмелерін басқару"
    rollback: "Статистиканы қайтару"


# =========================================================================
#                    Snapshot
# =========================================================================
snapshot:
  creating: "<yellow>📸 Снапшот жасалуда..."
  success: "<green>✅ Снапшот сақталды."
  error: "<red>❌ Қате: {error}"


# =========================================================================
#                    Holograms
# =========================================================================
holograms:
  # Басқару
  created: "<green>✅ Голограмма жасалды: <white>{stat}"
  removed: "<green>✅ Голограмма жойылды: <white>{name}"
  list-empty: "<yellow>Белсенді голограммалар жоқ."
  list-header: "<green>Белсенді голограммалар: <white>{list}"
  reloaded: "<green>✅ Голограммалар қайта жүктелді."
  module-disabled: "<red>'holograms' модулі config.yml-де өшірілген."

  # Стат атаулары (defaultTitle үшін)
  stats:
    play_time: "Ойын уақыты"
    kills: "Өлтірулер"
    mobs_killed: "Мобтар"
    bosses_killed: "Босстар"
    blocks_placed: "Қойылған блоктар"
    blocks_broken: "Сындырылған блоктар"
    balance: "Баланс"
    deaths: "Өлімдер"
    killstreak: "Өлтіру сериясы"


