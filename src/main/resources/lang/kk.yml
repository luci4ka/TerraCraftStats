    <yellow>/playerstats backup restore <file> <gray>— қалпына келтіру
    <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━

  list-empty: "<yellow>Сақталған сақтық көшірмелер жоқ."
  list-header: "<gold>📦 Сақтық көшірмелер (<white>{count}<gold>):"
  list-entry: "<gray>  • <white>{file} <dark_gray>({size})"

  restore-usage: "<red>Қолдану: <yellow>/playerstats backup restore <file>"
  restore-starting: "<yellow>⏳ <white>{file}</white> ішінен қалпына келтіру..."
  restore-done: "<green>✅ ДҚ <white>{file}</white> ішінен қалпына келтірілді. <red>Серверді қайта іске қосыңыз!"
  restore-error: "<red>❌ <white>{file}</white> ішінен қалпына келтіру мүмкін болмады."
  module-disabled: "<red>'backup' модулі config.yml-де өшірілген."


# =========================================================================
#                    Статистиканы қайтару
# =========================================================================
rollback:
  usage: |-
    <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━
    <gold>🔄 Статистиканы қайтару:
    <yellow>/stats rollback <player> <stat> <value> <gray>— мәнді орнату
    <yellow>/stats rollback <player> --all <value> <gray>— бәрін нөлдеу
    <yellow>/stats rollback <player> --from <date> <stat> <gray>— күннен қайтару
    <dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━

  done: "<green>✅ <white>{player}</white>: <yellow>{stat}</yellow> = <white>{value}"
  done-all: "<green>✅ <white>{player}</white>: барлық статтар нөлденді (<white>{count}</white> жазба)"
  done-from: "<green>✅ <white>{player}</white>: <yellow>{stat}</yellow> <white>{delta}</white> мәніне қайтарылды → <white>{value}"

  notify: "<red>⚠ Сіздің <yellow>{stat}</yellow> статыңыз әкімшімен өзгертілді: <white>{value}"
  notify-all: "<red>⚠ Сіздің статтарыңыз әкімшімен нөлденді (мән: <white>{value}<red>)"

  never-played: "<red>Ойыншы <yellow>{player}</yellow> серверде ешқашан ойнамаған."
  invalid-value: "<red>Қате мән: <white>{value}"
  invalid-date: "<red>Қате күн: <white>{date}"
  error: "<red>❌ Қайтару қатесі. Консольді тексеріңіз."


