# =========================================================================
#                       PlayerStats — Discord Webhook
# =========================================================================
# Модуль: modules.discord в config.yml
# Отправляет события в Discord через webhook.
# =========================================================================

enabled: false

# URL webhook'а из настроек канала Discord
# Server Settings → Integrations → Webhooks → New Webhook → Copy URL
webhook-url: "https://discord.com/api/webhooks/..."

# Имя и аватар бота
username: "PlayerStats"
avatar-url: ""

# =========================================================================
#                       Rate limit
# =========================================================================
# Минимальный интервал между сообщениями (защита от спама).
# Discord позволяет ~5 запросов в 2 секунды на один webhook.
rate-limit-seconds: 5

# =========================================================================
#                       События
# =========================================================================

events:
  # Достижения игрока
  achievement-unlock: true
  # Вехи (milestones)
  milestone: true
  # Смена топ-1
  top-change: false
  # Rollback админом
  rollback: false
  # Уровни (если будут)
  level-up: false

# =========================================================================
#                       Embed-шаблоны
# =========================================================================
# MiniMessage-теги НЕ поддерживаются в Discord — используйте plain-text
# или маркдаун Discord (**жирный**, *курсив*, `код`).
#
# Плейсхолдеры:
#   {player}   — имя игрока
#   {name}     — название достижения/вехи
#   {value}    — значение
#   {category} — категория
#   {message}  — готовое сообщение из lang.yml

embeds:
  achievement-unlock:
    title: "🏆 {player} получил достижение!"
    color: 15844367      # золотой (decimal)
    description: "**{name}**\n{message}"

  milestone:
    title: "🎯 {player} достиг вехи!"
    color: 5763719       # зелёный
    description: "**{name}**"

  top-change:
    title: "👑 Новый #1 в {category}!"
    color: 16766720      # оранжевый
    description: "{player} теперь лидер с **{value}**"

  rollback:
    title: "🔄 Админ откатил статистику"
    color: 15548997      # красный
    description: "**{player}** — `{category}` = {value}"

# =========================================================================
#                       Продвинутое
# =========================================================================

# Добавлять timestamp к embeds
use-timestamp: true

# Кто упоминается в сообщении (без @ — не пинговать)
# Варианты: "none", "here", "everyone", "@role_id"
mention: "none"

# Отправлять в отдельный webhook ошибок (пусто — не использовать)
error-webhook-url: ""