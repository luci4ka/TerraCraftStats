  # ==========================================================================
  #  ОТКЛЮЧЕНО / ТРЕБУЕТ ДОРАБОТКИ КОДА
  #
  #  Следующие секции НЕ работают, потому что соответствующие statKey
  #  нигде не пишутся в player_stats. Чтобы включить — добавьте маппинг
  #  в VanillaStatsListener.mapStatistic (или счётчик в StatsListener),
  #  затем раскомментируйте секцию ниже и удалите её из этого блока.
  #
  #  snowballs_thrown   → Statistic.SNOWBALLS_THROWN
  #  eggs_thrown        → Statistic.EGGS_THROWN
  #  items_smelted      → Statistic.ITEMS_SMELTED
  #  treasures_found    → Statistic.TREASURE_FISHED
  #  milk_taken         → Statistic.MILK_TAKEN
  #  water_buckets      → Statistic.FILL_BUCKET (только вода)
  #  lava_buckets       → Statistic.FILL_BUCKET (только лава)
  #  items_dropped      → Statistic.DROP
  #  items_picked_up    → Statistic.PICKUP
  #  fertilising        → PlayerInteractEvent + BONE_MEAL
  #  fireworks_used     → Statistic.FIREWORK_ROCKET_LAUNCHED
  #  music_discs_played → Statistic.PLAY_NOTE_BLOCK / PLAY_RECORD
  #  raids_won          → уже маппится (RAID_WIN), но секция ниже может быть
  #                       возвращена — она рабочая
  #
  #  Пример включения после доработки:
  #
  #  snowballs_thrown:
  #    - threshold: 100
  #      display-name: "<white>Снежок"
  #      message: "<gray>100 снежков брошено!"
  #      goal: "<gray>Бросьте 100 снежков"
  #      reward:
  #        money: 50
  #        command: "give %player% snowball 32"
  # ==========================================================================

  raids_won:
    - threshold: 1
      display-name: "<yellow>Accident or intentional?"
      message: "<gray>Рейд выигран!"
      goal: "<gray>Выиграйте 1 рейд"
      reward:
