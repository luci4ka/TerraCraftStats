# ============================================================================
#  TerraCraftStats — achievements.yml
#  Версия схемы: 4
#
#  ВАЖНО:
#   • threshold сравнивается с тем, что плагин пишет в player_stats.
#   • Единицы измерения:
#       play_time / sneak_time / sprint_time   — СЕКУНДЫ
#       distance_walked                        — БЛОКИ
#       elytra/boat/minecart/climbed_ladders   — САНТИМЕТРЫ (ванильный Statistic)
#       damage_dealt/taken/blocked             — единицы урона (1 сердце = 2)
#   • Ключ = имя statKey из stat_types. Если ключ нигде не пишется —
#     достижение никогда не сработает (см. секцию "ОТКЛЮЧЕНО" в конце).
# ============================================================================

enabled: true

notify:
  chat: true
  title: true
  action-bar: false
  sound: "entity.player.levelup"
  firework: true

achievements:

  # ==========================================================================
  #  БЛОКИ
  # ==========================================================================
  blocks_broken:
    - threshold: 1
      display-name: "<yellow>Первый блок"
      message: "<gray>Вы сломали первый блок!"
      goal: "<gray>Сломайте 1 блок"
    - threshold: 10
      display-name: "<yellow>10 блоков"
      message: "<gray>Вы сломали 10 блоков!"
      goal: "<gray>Сломайте 10 блоков"
      reward:
        money: 10
        command: ""
    - threshold: 100
      display-name: "<yellow>100 блоков"
      message: "<gray>Вы сломали 100 блоков!"
      goal: "<gray>Сломайте 100 блоков"
      reward:
        money: 100
        command: ""
    - threshold: 1000
      display-name: "<gold>1000 блоков"
      message: "<gray>Вы сломали 1000 блоков!"
      goal: "<gray>Сломайте 1000 блоков"
      reward:
        money: 1000
        command: "give %player% diamond 5"

  blocks_placed:
    - threshold: 1
      display-name: "<yellow>Первый блок"
      message: "<gray>Вы поставили первый блок!"
      goal: "<gray>Поставьте 1 блок"
    - threshold: 100
      display-name: "<yellow>100 блоков"
      message: "<gray>Вы поставили 100 блоков!"
