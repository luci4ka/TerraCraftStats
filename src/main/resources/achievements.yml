# =========================================================================
#                    Достижения
# =========================================================================
# ⚠ ТЕКСТЫ (name, description) — в lang/<lang>.yml → achievements.list.<id>
# ⚠ СООБЩЕНИЯ — в lang/<lang>.yml → achievements.messages.*
#
# Здесь — только технические поля:
#   icon: MATERIAL       # Material для GUI
#   stat: kills          # статистика для проверки
#   threshold: 100       # порог
#   category: pvp        # pvp, pve, blocks, time, killstreak, misc, special
#   broadcast: true      # сообщать в чат
#   commands:            # награды (от консоли)
#     - "give %player% diamond 1"
# =========================================================================

