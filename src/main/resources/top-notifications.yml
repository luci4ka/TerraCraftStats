# =========================================================================
#                    Уведомления о смене топа
# =========================================================================

enabled: true

check-seconds: 300
only-first-place: false
send-to-discord: true

categories:
  kills: true
  mobs: true
  blocks: true
  playtime: true
  balance: true

messages:
  first-place: "<gold>📢 <yellow>{player}</yellow> обогнал <red>{previous}</red> и теперь <green>#1</green> по {category}!"
  top3-enter: "<gold>📢 <yellow>{player}</yellow> вошёл в <green>топ-3</green> по {category} (<white>#{rank}</white>)!"
  top3-leave: "<gray>📢 <yellow>{player}</yellow> покинул <red>топ-3</red> по {category}."

  categories:
    kills: "убийствам"
    mobs: "мобам"
    blocks: "блокам"
    playtime: "времени игры"
    balance: "балансу"