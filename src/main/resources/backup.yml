# =========================================================================
#                       PlayerStats — Резервные копии БД
# =========================================================================
# Модуль: modules.backup в config.yml
# =========================================================================

enabled: true

# Как часто делать бэкап (в часах)
interval-hours: 6

# Задержка перед первым бэкапом (в минутах)
initial-delay-minutes: 1

# Сколько последних бэкапов хранить (старые удаляются)
keep-count: 14

# Папка для бэкапов (относительно plugins/PlayerStats/)
folder: "backups"

# Формат имени файла (Java SimpleDateFormat)
filename-format: "yyyy-MM-dd_HH-mm-ss"

# =========================================================================
#                       Логирование
# =========================================================================

# Логировать ли каждый бэкап в консоль
log-each-backup: true

# Делать ли бэкап ПЕРЕД миграцией БД (рекомендуется)
before-migration: true

# =========================================================================
#                       Сжатие
# =========================================================================

# Сжимать через gzip (.db → .db.gz, .sql → .sql.gz)
# Экономит 5-10× места.
# Восстановление: gunzip → заменить playerstats.db
gzip: true

# =========================================================================
#                       MySQL
# =========================================================================
# Только для database.type: mysql

# Путь к mysqldump (пусто — искать в PATH)
mysqldump-path: ""

# =========================================================================
#                       Продвинутое
# =========================================================================

# Хранить ли safety-бэкап перед restore (.before-restore)
keep-before-restore: true

# Логировать ли cleanup старых бэкапов
log-cleanup: true