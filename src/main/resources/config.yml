# =========================================================================
#                        PlayerStats Configuration
# =========================================================================
# Плагин статистики игроков для Paper 1.21+
# https://github.com/luci4ka/PlayerStats
#
# НЕ ИЗМЕНЯЙТЕ config-version вручную — это сломает миграцию!
#
# Модули находятся в отдельных файлах:
#   plugins/PlayerStats/achievements.yml
#   plugins/PlayerStats/milestones.yml
#   plugins/PlayerStats/top-chips.yml
#   plugins/PlayerStats/top-notifications.yml
#   plugins/PlayerStats/sparkline.yml
#   plugins/PlayerStats/holograms.yml
#   plugins/PlayerStats/backup.yml
#   plugins/PlayerStats/api.yml
#   plugins/PlayerStats/discord.yml
#   plugins/PlayerStats/cosmetics.yml
# =========================================================================

config-version: 4
debug-level: 1
language: ru


# =========================================================================
#                          Модули
# =========================================================================
# Отключите ненужные модули для экономии ресурсов.
# После изменения — /playerstats reload.

modules:
  top-chips: true
  top-notifications: true
  sparkline: true
  holograms: true
  achievements: true
  milestones: true
  backup: true
  api: false
  discord: false
  cosmetics: false


# =========================================================================
#                          База данных
# =========================================================================

database:
  type: sqlite
  host: localhost
  port: 3306
  name: playerstats
  user: root
  password: password

sqlite:
  file: playerstats.db


# =========================================================================
#                          Мультисерверность
# =========================================================================

multi-server:
  enabled: false
  server-name: "survival"


# =========================================================================
#                    Отображаемые имена серверов
# =========================================================================

server-names:
  survival: "<green>Выживание"
  creative: "<aqua>Креатив"
  minigames: "<yellow>Мини-игры"
  default: "<gold>Основной сервер"


# =========================================================================
#                    Группы игроков
# =========================================================================

groups:
  default: "<gray>Игрок"
  donor: "<gray>Донор"
  premium: "<green>Премиум"
  deluxe: "<aqua>Делюкс"
  elite: "<gold>Элита"
  overlord: "<dark_purple>Владыка"
  oldtimer: "<yellow>Старичок"
  helper: "<green>Помощник"
  moderator: "<dark_green>Модератор"
  admin: "<red>Админ"
  headadmin: "<dark_red><bold>Гл. Админ"


# =========================================================================
#                    Кликабельные команды в /stats
# =========================================================================

stats-click-commands:
  blocks: "/top blocks_placed"
  pve: "/top mobs_killed"
  time: "/top play_time"
  pvp: "/stats pvp"
  balance: "/balance"
  group: "/groups"
  server: "/server info"


# =========================================================================
#                          PvP
# =========================================================================

pvp:
  per-victim-stats: true
  antifarm-cooldown-seconds: 300
  ignore-excluded-victims: true
  daily-limit-per-victim: 0


# =========================================================================
#                    Rollback статистики
# =========================================================================
# После rollback игрок не может увеличивать стату N секунд
# (чтобы «откаченное» значение не вернулось при следующем убийстве).

rollback:
  lock-seconds: 60
  notify-player: true
  log-to-console: true
  # ⚠ Таблица stat_deltas быстро растёт. Только для отладки.
  track-deltas: false


# =========================================================================
#                    Отслеживание (tracking)
# =========================================================================
# Какие статистики отслеживать, какие блоки — ценные, какие мобы — боссы.

tracking:
  # Какие статистики вообще собирать
  stats:
    distance_walked: true
    damage_dealt: true
    damage_taken: true
    killstreak: true
    best_killstreak: true
    items_crafted: true
    food_consumed: true
    arrows_shot: true
    fish_caught: true
    entities_tamed: true
    entities_bred: true
    teleports: true
    portal_uses: true
    logins: true

  # Ценные блоки (block_placed_<name>, block_broken_<name>)
  blocks:
    - "diamond_ore"
    - "deepslate_diamond_ore"
    - "emerald_ore"
    - "deepslate_emerald_ore"
    - "gold_ore"
    - "deepslate_gold_ore"
    - "nether_gold_ore"
    - "iron_ore"
    - "deepslate_iron_ore"
    - "coal_ore"
    - "deepslate_coal_ore"
    - "lapis_ore"
    - "deepslate_lapis_ore"
    - "redstone_ore"
    - "deepslate_redstone_ore"
    - "copper_ore"
    - "deepslate_copper_ore"
    - "ancient_debris"
    - "netherite_block"
    - "diamond_block"
    - "emerald_block"
    - "gold_block"
    - "iron_block"
    - "lapis_block"
    - "redstone_block"
    - "coal_block"
    - "copper_block"

  # Ключевые слова для определения боссов
  mob-boss-keywords:
    - "Босс"
    - "Boss"
    - "Elite"
    - "Элитный"
    - "World Boss"


# =========================================================================
#                          Дополнительно
# =========================================================================

enable-stat-sharing: true
only-allow-one-lookup-at-a-time-per-player: true