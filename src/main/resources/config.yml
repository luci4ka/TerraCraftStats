# =========================
# PlayerStats Configuration
# =========================

config-version: 1
debug-level: 1               # 0 = off, 1 = basic, 2 = verbose

# =========================
# Database Configuration
# =========================
database:
  type: sqlite              # "sqlite" or "mysql"
  host: localhost           # MySQL host
  port: 3306                # MySQL port
  name: playerstats         # MySQL database name
  user: root                # MySQL username
  password: password        # MySQL password

sqlite:
  file: plugins/PlayerStats/playerstats.db

# =========================
# Multi-Server
# =========================
multi-server:
  enabled: false             # Enable if using multiple servers with one database
  server-name: "survival"    # Unique server identifier

# =========================
# Server Names Translation
# =========================
server-names:
  survival: "§aВыживание"
  creative: "§bКреатив"
  minigames: "§eМини-игры"

# =========================
# HTTP API
# =========================
api:
  enabled: false             # Enable HTTP API for external access
  host: "0.0.0.0"
  port: 8080

# =========================
# Player Groups & Formatting
# =========================
groups:
  default: "§7Игрок"
  vip: "§6VIP"
  premium: "§bPremium"
  moderator: "§2Модератор"
  admin: "§4Администратор"
  owner: "§c§lВладелец"
  helper: "§3Помощник"
  builder: "§5Строитель"

# =========================
# Clickable commands in stats GUI
# =========================
stats-click-commands:
  blocks: "/top blocks"
  pve: "/top pve"
  time: "/top time"
  pvp: "/top pvp"
  balance: "/balance"
  group: "/groups"
  server: "/server info"

# =========================
# Boss Detection Keywords
# =========================
mob-boss-keywords:
  - "Босс"
  - "Boss"
  - "Elite"
  - "Элитный"
  - "World Boss"