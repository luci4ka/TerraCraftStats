# =========================================================================
#                        PlayerStats Configuration
# =========================================================================
# Плагин статистики игроков для Paper 1.21+
# https://github.com/luci4ka/PlayerStats
#
# НЕ ИЗМЕНЯЙТЕ config-version вручную — это сломает миграцию!
#
# Модули (achievements, milestones, top-chips, top-notifications, sparkline)
# находятся в отдельных файлах:
#   plugins/PlayerStats/achievements.yml
#   plugins/PlayerStats/milestones.yml
#   plugins/PlayerStats/top-chips.yml
#   plugins/PlayerStats/top-notifications.yml
#   plugins/PlayerStats/sparkline.yml
# =========================================================================

config-version: 3
debug-level: 1
language: ru


# =========================================================================
#                          Модули
# =========================================================================
# Отключите ненужные модули для экономии ресурсов.
# После изменения — /playerstats reload.

modules:
  top-chips: true
  top-notifications: true
  sparkline: true
  holograms: true
  achievements: true
  milestones: true
  api: false


# =========================================================================
#                          База данных
# =========================================================================

database:
  type: sqlite
  host: localhost
  port: 3306
  name: playerstats
  user: root
  password: password

sqlite:
  file: playerstats.db


# =========================================================================
#                          Мультисерверность
# =========================================================================

multi-server:
  enabled: false
  server-name: "survival"


# =========================================================================
#                    Отображаемые имена серверов
# =========================================================================

server-names:
  survival: "<green>Выживание"
  creative: "<aqua>Креатив"
  minigames: "<yellow>Мини-игры"
  default: "<gold>Основной сервер"


# =========================================================================
#                    Группы игроков
# =========================================================================

groups:
  default: "<gray>Игрок"
  donor: "<gray>Донор"
  premium: "<green>Премиум"
  deluxe: "<aqua>Делюкс"
  elite: "<gold>Элита"
  overlord: "<dark_purple>Владыка"
  oldtimer: "<yellow>Старичок"
  helper: "<green>Помощник"
  moderator: "<dark_green>Модератор"
  admin: "<red>Админ"
  headadmin: "<dark_red><bold>Гл. Админ"


# =========================================================================
#                    Кликабельные команды в /stats
# =========================================================================

stats-click-commands:
  blocks: "/top blocks_placed"
  pve: "/top mobs_killed"
  time: "/top play_time"
  pvp: "/stats pvp"
  balance: "/balance"
  group: "/groups"
  server: "/server info"


# =========================================================================
#                    Ключевые слова для боссов
# =========================================================================

mob-boss-keywords:
  - "Босс"
  - "Boss"
  - "Elite"
  - "Элитный"
  - "World Boss"


# =========================================================================
#                    Отслеживаемые статистики
# =========================================================================

tracked-stats:
  distance_walked: true
  damage_dealt: true
  damage_taken: true
  killstreak: true
  best_killstreak: true
  items_crafted: true
  food_consumed: true
  arrows_shot: true
  fish_caught: true
  entities_tamed: true
  entities_bred: true
  teleports: true
  portal_uses: true
  logins: true


# =========================================================================
#                    Tracked Blocks — ценные блоки
# =========================================================================

tracked-blocks:
  - "diamond_ore"
  - "deepslate_diamond_ore"
  - "emerald_ore"
  - "deepslate_emerald_ore"
  - "gold_ore"
  - "deepslate_gold_ore"
  - "nether_gold_ore"
  - "iron_ore"
  - "deepslate_iron_ore"
  - "coal_ore"
  - "deepslate_coal_ore"
  - "lapis_ore"
  - "deepslate_lapis_ore"
  - "redstone_ore"
  - "deepslate_redstone_ore"
  - "copper_ore"
  - "deepslate_copper_ore"
  - "ancient_debris"
  - "netherite_block"
  - "diamond_block"
  - "emerald_block"
  - "gold_block"
  - "iron_block"
  - "lapis_block"
  - "redstone_block"
  - "coal_block"
  - "copper_block"


# =========================================================================
#                          PvP
# =========================================================================

pvp:
  per-victim-stats: true
  antifarm-cooldown-seconds: 300
  ignore-excluded-victims: true
  daily-limit-per-victim: 0


# =========================================================================
#                    Holograms — голограммы топов
# =========================================================================
# Требует DecentHolograms. Голограммы обновляются раз в минуту.
# Сохраняются автоматически при /playerstats hologram create.

holograms:
  enabled: true


# =========================================================================
#                    HTTP API
# =========================================================================

api:
  enabled: false
  host: "0.0.0.0"
  port: 8080


# =========================================================================
#                    Discord Webhook
# =========================================================================

discord:
  enabled: false
  webhook-url: "https://discord.com/api/webhooks/..."
  username: "PlayerStats"
  avatar-url: ""

  events:
    milestone: true
    level-up: false
    top-change: false


# =========================================================================
#                    Rainbow & Festive
# =========================================================================

rainbow:
  enabled: false
  apply-to:
    - "stats.title-self"
    - "stats.title-other"
    - "top.header"
    - "top.category-time"
    - "top.category-mobs"
    - "top.category-blocks"
    - "top.category-balance"
    - "compare.title"
    - "help.title"

festive:
  enabled: false
  apply-to:
    - "stats.title-self"
    - "stats.title-other"


# =========================================================================
#                          Дополнительно
# =========================================================================

enable-stat-sharing: true
only-allow-one-lookup-at-a-time-per-player: true