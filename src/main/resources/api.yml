# =========================================================================
#                       PlayerStats — HTTP API
# =========================================================================
# Модуль: modules.api в config.yml
# REST API для внешних сервисов (веб-панели, боты, статистика).
# =========================================================================

enabled: false

# Адрес и порт
# 0.0.0.0 — слушать все интерфейсы
# 127.0.0.1 — только локально (за reverse-proxy)
host: "0.0.0.0"
port: 8080

# =========================================================================
#                       Аутентификация
# =========================================================================

auth:
  # Автогенерация ключа при первом запуске
  auto-generate-key: true

  # Текущий ключ (если auto-generate-key: false — задать вручную)
  # Оставь пустым, чтобы ключ сгенерировался сам
  api-key: ""

  # Отправлять ли ключ в консоль при генерации
  log-key-on-startup: true

  # Заголовок для передачи ключа
  # "Authorization: Bearer <key>"  или  "X-API-Key: <key>"
  header: "X-API-Key"
  bearer-prefix: "Bearer "

  # Публичные роуты (не требуют ключа)
  public-routes:
    - "/api/health"
    - "/api/version"

# =========================================================================
#                       CORS
# =========================================================================
# Для запросов из браузера (веб-панели).

cors:
  enabled: false
  allow-origin: "*"
  allow-methods: "GET, OPTIONS"
  allow-headers: "Content-Type, X-API-Key, Authorization"

# =========================================================================
#                       Rate limiting
# =========================================================================

rate-limit:
  enabled: true
  requests-per-minute: 60

# =========================================================================
#                       Продвинутое
# =========================================================================

# Логировать ли каждый запрос в консоль
log-requests: false

# Максимальный размер ответа (в записях топа)
max-top-limit: 100