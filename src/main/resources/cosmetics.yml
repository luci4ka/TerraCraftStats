# =========================================================================
#                       PlayerStats — Косметика
# =========================================================================
# Модуль: modules.cosmetics в config.yml
# Rainbow/Festive-эффекты для текстов.
# =========================================================================

# =========================================================================
#                       Rainbow
# =========================================================================
# Плавная радуга на тексте (MiniMessage <rainbow>).

rainbow:
  enabled: false

  # К каким ключам lang.yml применять радугу
  apply-to:
    - "stats.title-self"
    - "stats.title-other"
    - "top.header"
    - "top.category-time"
    - "top.category-mobs"
    - "top.category-blocks"
    - "top.category-balance"
    - "compare.title"
    - "help.title"

  # Настройки градиента
  # phase — скорость анимации (обновляется в тиках)
  phase: 5
  # saturation/brightness — HSV-цвета
  saturation: 100
  brightness: 100

# =========================================================================
#                       Festive
# =========================================================================
# Праздничный градиент (например, красный → зелёный на Рождество).

festive:
  enabled: false

  # К каким ключам lang.yml применять
  apply-to:
    - "stats.title-self"
    - "stats.title-other"

  # Цвета градиента (от → к)
  # Формат: HEX без #
  from-color: "FF0000"
  to-color: "00FF00"

  # Пресеты праздников (переключаются автоматически по дате)
  # Если активно — переопределяет from-color/to-color
  presets:
    enabled: false
    # Формат: MM-DD → [from, to]
    christmas:
      dates: ["12-24", "12-26"]
      from: "FF0000"
      to: "00AA00"
    halloween:
      dates: ["10-31", "10-31"]
      from: "FF6600"
      to: "440044"
    new-year:
      dates: ["12-31", "01-01"]
      from: "FFD700"
      to: "FFAA00"

# =========================================================================
#                       Общее
# =========================================================================

# Обновлять ли текст динамически (для игрока — каждый показ)
# true — радуга «двигается»
# false — статичный градиент
animated: true

# Тик обновления анимации (в тиках, 20 = 1 сек)
# Меньше — плавнее, но больше нагрузки
animation-tick: 10